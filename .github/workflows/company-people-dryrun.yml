name: Company people dry run (PR branch only)

# Temporary test harness for scripts/build_company_people.py. Runs the full
# 232-ticker build, prints the four check tickers, uploads the file as an
# artifact and commits it to this PR branch (never main) so the preview can
# render it. Remove before merge; the daily job takes over after that.

on:
  push:
    branches: [claude/charming-goldberg-tt6v7y]
    paths:
      - scripts/build_company_people.py
      - .github/workflows/company-people-dryrun.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-people-dryrun
  cancel-in-progress: true

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_company_people.py
      - name: Build all tickers
        run: python scripts/build_company_people.py
      - name: Show the check tickers
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/company-people.json", encoding="utf-8"))
          print("counts", d["counts"], "errors", d["errors"][:20])
          for tk in ["AWC", "CPN", "PRG", "FTREIT"]:
              r = d["tickers"].get(tk) or {}
              b = r.get("board") or []
              s = r.get("shareholders") or {}
              print(f"\n== {tk}: board {len(b)} ({sum(x['independent'] for x in b)} independent), applicable={r.get('boardApplicable')}")
              for x in b:
                  print("   ", x["name"], "|", x.get("nameTh"), "|", "; ".join(x["positions"]))
              print(f"   holders: record {s.get('recordDate')} {s.get('caType')} total {s.get('totalShareholder')} free float {(s.get('freeFloat') or {}).get('percent')}")
              for h in (s.get("major") or [])[:10]:
                  print(f"    {h['rank']:>2} {h['pct']:>6}%  {h['shares']:>15,}  {'NVDR ' if h['nvdr'] else ''}{h['name']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: company-people
          path: data/company-people.json
      - name: Commit to this PR branch
        if: github.ref == 'refs/heads/claude/charming-goldberg-tt6v7y'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company-people.json
          git diff --staged --quiet && exit 0
          git commit -m "test(data): company-people dry run $(date -u +%Y-%m-%dT%H:%MZ)"
          # The branch may have moved while the build ran; replay on top.
          for attempt in 1 2 3; do
            git pull --rebase origin claude/charming-goldberg-tt6v7y && git push origin HEAD:claude/charming-goldberg-tt6v7y && exit 0
            sleep $((attempt * 5))
          done
          exit 1
