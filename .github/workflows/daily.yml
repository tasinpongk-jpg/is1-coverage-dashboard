name: Daily Surveillance + Build

# Consolidated daily workflow:
#   Job 1 (surveillance): poll new SET disclosures, classify with rules-only
#                         engine (misses tagged 'unclassified' for offline
#                         rule-mining), send critical + digest emails,
#                         upload DuckDB to R2 (for laptop sync) and as a
#                         workflow artifact (for Job 2).
#   Job 2 (build):        download DuckDB artifact from Job 1, run 4 SETSMART
#                         routes, commit data/*.json. Cloudflare auto-deploys.
#
# Schedule (Mon-Fri):
#   02:50 UTC = 09:50 Bangkok — single morning run, full pipeline.
#
# Critical alerts are idempotent (only fire on UNSENT items) so re-running
# manually via workflow_dispatch is safe.
#
# Secrets required: SETSMART_API_KEY, ANTHROPIC_API_KEY, SURVEILLANCE_SQL,
#   EMAIL_USERNAME, EMAIL_APP_PASSWORD, EMAIL_FROM, EMAIL_TO,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET.

on:
  schedule:
    - cron: '15 2 * * 1-5'    # 09:15 BKK morning — full pipeline
  workflow_dispatch:

permissions:
  contents: write

# Run JavaScript actions on Node.js 24 ahead of GitHub's June 2, 2026 default
# switch. Silences the Node 20 deprecation warning without bumping action
# major versions. Remove once Node 24 becomes the runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # JOB 1 — Surveillance (poll SET, classify, email alerts, upload DB)
  # ------------------------------------------------------------------
  surveillance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SURVEILLANCE_DB_PATH: /tmp/surveillance.duckdb
      PYTHONUTF8: '1'
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: surveillance/requirements.txt

      - name: Install surveillance dependencies
        run: pip install -r surveillance/requirements.txt

      # Headless Chromium for the SEC Form 59 scrape (SEC iDisc is behind an F5
      # bot-defense WAF that plain httpx can't pass; only a real browser gets the
      # rendered table). Best-effort: external_sources.py degrades gracefully if
      # the browser is missing, and the Form 59 step is continue-on-error anyway.
      - name: Install Playwright Chromium (for SEC Form 59)
        run: python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Download surveillance.duckdb from R2
        # boto3-based; tolerates missing object (first run) by exiting 0 with a warning.
        run: python surveillance/r2_sync.py download

      - name: Health check (schema-drift smoke test)
        working-directory: surveillance
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python health_check.py

      - name: Poll SET disclosures (lookback 2 days)
        working-directory: surveillance
        run: python poll.py --lookback-days 2

      - name: Classify (rules first, Groq free-tier fall-through on misses)
        working-directory: surveillance
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python classify_batch.py

      - name: Translate legacy EN-only headlines to Thai
        working-directory: surveillance
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python translate_titles.py
        continue-on-error: true

      # External news / trading signs / SEC enforcement / SEC Form 59.
      # Best-effort: any source that fails logs and continues. Failures in
      # this step never block the SET pipeline above or the build job below.
      - name: Fetch external sources (RSS, signs, SEC, Form 59)
        working-directory: surveillance
        run: python external_sources.py
        continue-on-error: true

      - name: Send critical alerts (one batched email per RM)
        id: critical_email
        working-directory: surveillance
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python route_alerts.py --mode critical
        continue-on-error: true

      - name: Send material digest
        id: digest_email
        working-directory: surveillance
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python route_alerts.py --mode digest
        continue-on-error: true

      - name: Upload surveillance.duckdb back to R2 (for laptop's IS1-Vault-Refresh)
        run: python surveillance/r2_sync.py upload

      - name: Upload surveillance.duckdb as artifact (handoff to build job + 30d audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surveillance-duckdb
          path: ${{ env.SURVEILLANCE_DB_PATH }}
          if-no-files-found: error
          retention-days: 30

      # Run last so R2 upload + artifact upload above always complete first.
      # Without continue-on-error, this fails the job (and the workflow run UI)
      # when an email step failed, surfacing SMTP issues that previously went
      # silent. The build job uses `if: always()` so JSON deploys still happen.
      - name: Surface email step failures
        if: always()
        env:
          CRITICAL_OUTCOME: ${{ steps.critical_email.outcome }}
          DIGEST_OUTCOME: ${{ steps.digest_email.outcome }}
        run: |
          echo "critical=$CRITICAL_OUTCOME  digest=$DIGEST_OUTCOME"
          fail=0
          [ "$CRITICAL_OUTCOME" = "failure" ] && { echo "::error::critical email step failed"; fail=1; }
          [ "$DIGEST_OUTCOME"   = "failure" ] && { echo "::error::digest email step failed";   fail=1; }
          exit $fail

      # Email-on-failure for the surveillance job. Only fires if a prior step
      # in this job failed. Pure stdlib (so it works even if classifier.py
      # or alerts.py themselves are the thing that broke).
      - name: Notify on failure (surveillance)
        if: failure()
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/notify_failure.py
        continue-on-error: true

  # ------------------------------------------------------------------
  # JOB 2 — Build (download DB artifact, generate 4 JSONs, commit)
  # ------------------------------------------------------------------
  build:
    needs: surveillance
    # Run even if surveillance failed (e.g. SMTP outage) — the artifact step
    # in surveillance is `if: always()` so the DuckDB is still available, and
    # JSON dashboards must keep refreshing regardless of email-channel health.
    if: always() && needs.surveillance.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SURVEILLANCE_DB_PATH: /tmp/surveillance.duckdb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Download surveillance.duckdb artifact (from job 1)
        uses: actions/download-artifact@v4
        with:
          name: surveillance-duckdb
          path: /tmp

      # Fail fast on SETSMART auth/quota issues BEFORE the 15-min 232-ticker scan.
      # Uses the proxy's existing /probe/auth handler, which calls
      # eod-price-by-symbol for PTT (1 day) and surfaces 401/403/429 in seconds.
      - name: SETSMART API probe
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import asyncio, sys
          sys.path.insert(0, "scripts")
          import setsmart_proxy as p
          result = asyncio.run(p.probe_auth())
          if hasattr(result, "body"):
              import json
              payload = json.loads(result.body.decode("utf-8"))
          else:
              payload = result
          print(f"SETSMART probe: {payload}")
          if not payload.get("ok"):
              sys.exit(f"SETSMART auth failed: {payload}")
          PY

      - name: Run daily build (~15 min for 232 tickers)
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}
          # Custom SQL that JOINs news_items with classifications so disclosure-pulse
          # gets proper severity labels; without it the default query returns NULL severities.
          SURVEILLANCE_SQL: ${{ secrets.SURVEILLANCE_SQL }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build_daily.py

      # Pure DB -> JSON, ~2 sec. Reads same DuckDB artifact already on disk.
      - name: Build external dashboard payloads
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/build_external.py
        continue-on-error: true

      - name: Build ticker summary (company profile + financials + governance)
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}
          SET_MAX_CONCURRENT: "3"
          SET_THROTTLE_S: "0.28"
          PYTHONIOENCODING: utf-8
        run: python scripts/build_ticker_summary.py
        continue-on-error: true

      # AI morning commentary over the snapshots just built (Groq free tier,
      # ~5 sec). Script exits 0 on any failure so commentary never blocks the
      # data deploy; the page falls back to the previous day's file.
      - name: Build AI insights commentary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build_ai_insights.py
        continue-on-error: true

      # Morning brief push — one email, a personalized section per RM, over
      # the snapshots just built. Exits 0 on any failure (never blocks deploy).
      - name: Send morning brief push (per-RM sections)
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build_morning_push.py
        continue-on-error: true

      - name: Commit and push if data changed
        # Only push from main. Manual dispatches from feature branches still
        # exercise the full build (and surface failures in build-status.json
        # artifact) without trying to fast-forward main from an unrelated ref.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "daily snapshot $(date -u +%Y-%m-%d)"
          # Another automation may update disclosure-pulse.json during this
          # ~20-minute build. Auto-resolve only generated data/*.json conflicts.
          # During a rebase, --theirs is this run's generated-data commit.
          # Any conflict outside generated JSON still fails safely.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — rebasing and retrying..."
            git rebase --abort 2>/dev/null || true
            if ! git pull --rebase origin main; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if (( ${#conflicts[@]} == 0 )); then
                echo "Rebase failed without a content conflict; retrying."
                git rebase --abort 2>/dev/null || true
                sleep $((attempt * 5))
                continue
              fi

              unsafe_conflict=false
              for path in "${conflicts[@]}"; do
                case "$path" in
                  data/*.json) ;;
                  *)
                    echo "Refusing to auto-resolve non-generated conflict: $path"
                    unsafe_conflict=true
                    ;;
                esac
              done
              if [[ "$unsafe_conflict" == "true" ]]; then
                git rebase --abort 2>/dev/null || true
                exit 1
              fi

              git checkout --theirs -- "${conflicts[@]}"
              git add -- "${conflicts[@]}"
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort 2>/dev/null || true
                sleep $((attempt * 5))
                continue
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1

      - name: Upload build status as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-status-${{ github.run_id }}
          path: data/build-status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # Keep the /api/chat access token in sync with the GitHub secret.
      # Idempotent; skipped when the secret isn't configured.
      - name: Sync chat token to Worker secret
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHAT_TOKEN_VALUE: ${{ secrets.CHAT_TOKEN }}
        run: |
          if [ -z "$CHAT_TOKEN_VALUE" ]; then
            echo "CHAT_TOKEN secret not set — skipping (chat returns 401)."
          else
            printf '%s' "$CHAT_TOKEN_VALUE" | npx wrangler secret put CHAT_TOKEN
          fi
        continue-on-error: true

      # Keep the MiniMax key used by all four chat agents in sync with the
      # GitHub secret. The key is never shipped to the browser.
      - name: Sync MiniMax key to Worker secret
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MINIMAX_KEY_VALUE: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ -z "$MINIMAX_KEY_VALUE" ]; then
            echo "MINIMAX_API_KEY secret not set; all four chat agents return a config error."
          else
            printf '%s' "$MINIMAX_KEY_VALUE" | npx wrangler secret put MINIMAX_API_KEY
          fi
        continue-on-error: true

      # Email-on-failure for the build job. Pairs with the equivalent step in
      # the surveillance job so we get notified regardless of which side broke.
      - name: Notify on failure (build)
        if: failure()
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/notify_failure.py
        continue-on-error: true
