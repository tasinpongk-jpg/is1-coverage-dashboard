<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lux Scanner — IS1 Team</title>
<style>
:root {
  --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a; --text:#e2e8f0;
  --muted:#7c8298; --accent:#6366f1;
  --green:#22c55e; --red:#ef4444; --yellow:#f59e0b; --blue:#3b82f6;
  --orange:#fb923c; --purple:#8b5cf6; --cyan:#06b6d4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:100}
header h1{font-size:16px;font-weight:600}
.meta{font-size:11px;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav a{color:var(--muted);text-decoration:none;font-size:12px;padding:4px 10px;border-radius:6px}
.nav a:hover{color:var(--text);background:var(--border)}
.nav a.active{color:var(--text);background:#6366f122;border:1px solid #6366f155}
.stale{font-size:11px;padding:3px 10px;border-radius:20px;background:#22c55e22;color:var(--green);border:1px solid #22c55e33}
.stale.warn{background:#f59e0b22;color:var(--yellow);border-color:#f59e0b33}

/* ── STATS BAR ── */
.stats-bar{display:flex;border-bottom:1px solid var(--border);background:var(--card)}
.stat{flex:1;text-align:center;padding:12px 8px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.stat-val.green{color:var(--green)}
.stat-val.yellow{color:var(--yellow)}
.stat-val.red{color:var(--red)}
.stat-val.blue{color:var(--blue)}

/* ── AI BRIEF BANNER ── */
.ai-brief{margin:14px 20px;background:linear-gradient(135deg,#6366f115,#8b5cf610);border:1px solid #6366f133;border-radius:10px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.ai-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.ai-content{flex:1}
.ai-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#a5b4fc;margin-bottom:6px}
.ai-text{font-size:13px;color:var(--text);line-height:1.65}
.ai-brief.empty{display:none}

/* ── FILTERS ── */
.filter-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:11px;color:var(--muted);margin-right:4px}
.tab{padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted);border:1px solid transparent;user-select:none;white-space:nowrap}
.tab:hover{color:var(--text);background:#2a2d3a}
.tab.active{background:#6366f122;border-color:#6366f155;color:var(--text);font-weight:600}

/* ── SECTOR RIBBON ── */
.sector-ribbon{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sector-chip{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;user-select:none}
.sector-chip:hover{opacity:.8}
.sector-chip.active{border-color:currentColor;opacity:1}

/* ── MAIN TABLE ── */
.table-wrap{padding:16px 20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
th{background:#0f1117;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:10px 12px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.sorted{color:var(--accent)}
th.sorted::after{content:' ▼';font-size:9px}
th.sorted.asc::after{content:' ▲';font-size:9px}
td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#1e2133}
.tk{font-size:15px;font-weight:800;letter-spacing:.3px}
.sector-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap}
.s-ENERGY{background:#f59e0b22;color:#fbbf24}
.s-BANKING{background:#3b82f622;color:#60a5fa}
.s-FINANCE{background:#06b6d422;color:#22d3ee}
.s-INDUSTRIAL{background:#8b5cf622;color:#a78bfa}
.s-PROPERTY{background:#8b5cf622;color:#c4b5fd}
.s-PFREIT{background:#06b6d422;color:#67e8f9}
.s-FOOD{background:#22c55e22;color:#4ade80}
.s-RETAIL{background:#f97316/22;color:#fb923c;background-color:#fb923c22}
.s-HEALTHCARE{background:#ec489922;color:#f472b6}
.s-TELECOM{background:#6366f122;color:#818cf8}
.s-TRANSPORT{background:#14b8a622;color:#2dd4bf}
.s-MEDIA{background:#a855f722;color:#c084fc}
.s-MATERIALS{background:#f59e0b22;color:#fcd34d}
.s-AGRI{background:#84cc1622;color:#a3e635}

/* ── SCORE BAR ── */
.score-wrap{display:flex;align-items:center;gap:8px;min-width:110px}
.score-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:60px}
.score-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.score-num{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}

/* ── TREND BADGE ── */
.trend-badge{font-size:10px;padding:3px 9px;border-radius:5px;font-weight:700;white-space:nowrap}
.trend-SB{background:#22c55e22;color:var(--green);border:1px solid #22c55e33}
.trend-B{background:#3b82f622;color:#60a5fa;border:1px solid #3b82f633}
.trend-N{background:#7c829822;color:var(--muted);border:1px solid #7c829833}
.trend-S{background:#f59e0b22;color:var(--yellow);border:1px solid #f59e0b33}
.trend-SS{background:#ef444422;color:var(--red);border:1px solid #ef444433}

/* ── PRICE / CHANGE ── */
.price{font-weight:600;font-variant-numeric:tabular-nums}
.chg{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.chg.pos{color:var(--green)}
.chg.neg{color:var(--red)}
.chg.zero{color:var(--muted)}

/* ── RSI CHIP ── */
.rsi-chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;font-variant-numeric:tabular-nums}
.rsi-ob{background:#ef444422;color:var(--red)}
.rsi-hi{background:#f59e0b22;color:var(--yellow)}
.rsi-ok{background:#22c55e22;color:var(--green)}
.rsi-lo{background:#3b82f622;color:#60a5fa}

/* ── INDICATOR DOTS ── */
.ind-row{display:flex;gap:4px;flex-wrap:wrap}
.ind{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600}
.ind-bull{background:#22c55e22;color:var(--green)}
.ind-bear{background:#ef444422;color:var(--red)}
.ind-neu{background:#7c829822;color:var(--muted)}

/* ── SIGNAL PILLS ── */
.sigs{display:flex;gap:3px;flex-wrap:wrap;max-width:260px}
.sig{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:700;white-space:nowrap}
.sig-LUX_BUY{background:#22c55e33;color:#4ade80}
.sig-TRAIL_BUY{background:#22c55e22;color:var(--green)}
.sig-AI_BULL_CLUSTER{background:#3b82f622;color:#60a5fa}
.sig-OSC_CROSS_UP{background:#8b5cf622;color:#a78bfa}
.sig-EMA_RIBBON_BULL{background:#6366f122;color:#818cf8}
.sig-MACD_CROSS{background:#06b6d422;color:#22d3ee}
.sig-VOL_SURGE{background:#f97316/22;color:#fb923c;background-color:#fb923c22}

/* ── SUP/RES ── */
.sr-row{display:flex;flex-direction:column;gap:1px;font-size:11px;font-variant-numeric:tabular-nums}
.sr-res{color:var(--red)}
.sr-sup{color:var(--green)}

/* ── SECTOR BREAKDOWN PANEL ── */
.sector-panel{padding:16px 20px;border-top:1px solid var(--border)}
.panel-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:12px}
.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.sector-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.sc-name{font-size:11px;font-weight:700;margin-bottom:4px}
.sc-bar-bg{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:4px 0}
.sc-bar-fill{height:100%;border-radius:2px;background:var(--green)}
.sc-stats{font-size:11px;color:var(--muted)}
.sc-stats span{color:var(--text);font-weight:600}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:60px;color:var(--muted);font-size:14px}

/* ── MARKET TONE BANNER ── */
.tone-banner{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;margin-left:10px}
.tone-STRONGLY.BULLISH,.tone-BULLISH{background:#22c55e22;color:var(--green);border:1px solid #22c55e33}
.tone-NEUTRAL{background:#7c829822;color:var(--muted);border:1px solid #7c829833}
.tone-BEARISH{background:#ef444422;color:var(--red);border:1px solid #ef444433}
</style>
</head>
<body>

<header>
  <div>
    <h1>Lux Scanner <span style="color:var(--muted);font-weight:400;font-size:13px">— Lux Algo signals · SET tickers · daily</span></h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <nav class="nav">
    <a href="index.html">Index</a>
    <a href="coverage-morning-brief.html">Brief</a>
    <a href="disclosure-pulse.html">Disclosures</a>
    <a href="oppday-minutes.html">Oppday</a>
    <a href="sector-heatmap.html">Heatmap</a>
    <a href="ticker-summary.html">Tickers</a>
    <a href="sector-comparison.html">Compare</a>
    <a href="unusual-trading.html">Alerts</a>
    <a href="external-news.html">External</a>
    <a href="trading-signs.html">Signs</a>
    <a href="sec-enforcement.html">SEC</a>
    <a href="macro-overlays.html">Macro</a>
    <a href="lux-scanner.html" class="active">Lux</a>
    <span class="stale" id="staleBadge">●</span>
  </nav>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="stat-val" id="sScanned">—</div><div class="stat-lbl">Scanned</div></div>
  <div class="stat"><div class="stat-val green" id="sBuy">—</div><div class="stat-lbl">Buy Signals</div></div>
  <div class="stat"><div class="stat-val" id="sStrongBuy">—</div><div class="stat-lbl">Strong Buy</div></div>
  <div class="stat"><div class="stat-val" id="sBuyPct">—</div><div class="stat-lbl">Buy %</div></div>
  <div class="stat"><div class="stat-val" id="sAvgScore">—</div><div class="stat-lbl">Avg Score</div></div>
  <div class="stat" id="sToneCell"><div class="stat-val" id="sTone">—</div><div class="stat-lbl">Market Tone</div></div>
</div>

<div class="ai-brief empty" id="aiBrief">
  <div class="ai-icon">🤖</div>
  <div class="ai-content">
    <div class="ai-label">Claude AI Brief</div>
    <div class="ai-text" id="aiText"></div>
  </div>
</div>

<div class="filter-bar">
  <span class="filter-label">Signal:</span>
  <div id="trendTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
  <span class="filter-label">Sort:</span>
  <div id="sortTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
</div>

<div class="sector-ribbon" id="sectorRibbon"></div>

<div class="table-wrap" id="tableWrap">
  <div class="empty">Loading scan data…</div>
</div>

<div class="sector-panel" id="sectorPanel" style="display:none">
  <div class="panel-title">Sector Breakdown</div>
  <div class="sector-grid" id="sectorGrid"></div>
</div>

<script>
let DATA = null;
let activeTrend = 'BUY+';
let activeSector = 'ALL';
let sortKey = 'score';
let sortAsc = false;

const TREND_FILTERS = [
  { key: 'BUY+',  label: 'Buy+',       fn: p => p.trend === 'STRONG BUY' || p.trend === 'BUY' },
  { key: 'SBUY',  label: 'Strong Buy',  fn: p => p.trend === 'STRONG BUY' },
  { key: 'ALL',   label: 'All',         fn: () => true },
  { key: 'NEUTRAL', label: 'Neutral',   fn: p => p.trend === 'NEUTRAL' },
  { key: 'SELL',  label: 'Sell / Weak', fn: p => p.trend === 'SELL' || p.trend === 'STRONG SELL' },
];

const SORT_OPTIONS = [
  { key: 'score',         label: 'Score' },
  { key: 'signal_count',  label: 'Signals' },
  { key: 'pct_change_1d', label: '1D %' },
  { key: 'rsi',           label: 'RSI' },
];

const SECTOR_COLORS = {
  ENERGY:'#fbbf24',BANKING:'#60a5fa',FINANCE:'#22d3ee',INDUSTRIAL:'#a78bfa',
  PROPERTY:'#c4b5fd',PFREIT:'#67e8f9',FOOD:'#4ade80',RETAIL:'#fb923c',
  HEALTHCARE:'#f472b6',TELECOM:'#818cf8',TRANSPORT:'#2dd4bf',
  MEDIA:'#c084fc',MATERIALS:'#fcd34d',AGRI:'#a3e635',
};

function freshnessLabel(builtAt) {
  if (!builtAt) return { txt: '?', warn: true };
  const ageH = (Date.now() - new Date(builtAt).getTime()) / 36e5;
  const txt = ageH < 1 ? `● ${Math.round(ageH * 60)}m ago`
            : ageH < 24 ? `● ${Math.round(ageH)}h ago`
            : `● ${Math.round(ageH / 24)}d ago`;
  return { txt, warn: ageH > 28 };
}

function scoreColor(s) {
  if (s >= 75) return 'var(--green)';
  if (s >= 55) return 'var(--blue)';
  if (s >= 40) return 'var(--yellow)';
  return 'var(--red)';
}

function trendClass(t) {
  const m = { 'STRONG BUY':'SB', 'BUY':'B', 'NEUTRAL':'N', 'SELL':'S', 'STRONG SELL':'SS' };
  return 'trend-' + (m[t] || 'N');
}

function rsiClass(r) {
  if (!r) return '';
  if (r >= 80) return 'rsi-ob';
  if (r >= 65) return 'rsi-hi';
  if (r >= 40) return 'rsi-ok';
  return 'rsi-lo';
}

function sigLabel(s) {
  const m = {
    LUX_BUY:'LUX', TRAIL_BUY:'TRAIL', AI_BULL_CLUSTER:'AI',
    OSC_CROSS_UP:'OSC', EMA_RIBBON_BULL:'EMA', MACD_CROSS:'MACD', VOL_SURGE:'VOL'
  };
  return m[s] || s;
}

function fmtChg(v) {
  if (v == null) return '<span class="chg zero">—</span>';
  const cls = v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero';
  const prefix = v > 0 ? '+' : '';
  return `<span class="chg ${cls}">${prefix}${v.toFixed(1)}%</span>`;
}

function buildFilterTabs() {
  document.getElementById('trendTabs').innerHTML = TREND_FILTERS.map(f =>
    `<div class="tab${f.key === activeTrend ? ' active' : ''}" onclick="setTrend('${f.key}')">${f.label}</div>`
  ).join('');
  document.getElementById('sortTabs').innerHTML = SORT_OPTIONS.map(s =>
    `<div class="tab${s.key === sortKey ? ' active' : ''}" onclick="setSort('${s.key}')">${s.label}</div>`
  ).join('');
}

function buildSectorRibbon(picks) {
  const counts = {};
  picks.forEach(p => { counts[p.sector] = (counts[p.sector] || 0) + 1; });
  const sectors = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const total = picks.length;
  const html = `<span class="filter-label">Sector:</span>
    <div class="sector-chip${activeSector === 'ALL' ? ' active' : ''}" style="background:var(--card);color:var(--text);border-color:var(--border)" onclick="setSector('ALL')">All <span style="color:var(--muted)">${total}</span></div>
    ` + sectors.map(([s, n]) => {
      const col = SECTOR_COLORS[s] || 'var(--muted)';
      const cls = activeSector === s ? ' active' : '';
      return `<div class="sector-chip${cls}" style="color:${col};background:${col}18" onclick="setSector('${s}')">${s} <span style="opacity:.7">${n}</span></div>`;
    }).join('');
  document.getElementById('sectorRibbon').innerHTML = html;
}

function getFilteredSorted() {
  if (!DATA) return [];
  const tfn = TREND_FILTERS.find(f => f.key === activeTrend)?.fn || (() => true);
  let rows = DATA.picks.filter(p => {
    if (!tfn(p)) return false;
    if (activeSector !== 'ALL' && p.sector !== activeSector) return false;
    return true;
  });
  rows = [...rows].sort((a, b) => {
    const av = a[sortKey] ?? -999, bv = b[sortKey] ?? -999;
    return sortAsc ? av - bv : bv - av;
  });
  return rows;
}

function renderTable() {
  const rows = getFilteredSorted();
  if (!rows.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">No picks match current filters.</div>';
    return;
  }
  const tbody = rows.map((p, i) => {
    const sc = p.score;
    const fillColor = scoreColor(sc);
    const fillPct = sc;
    const sigHtml = (p.signals || []).map(s =>
      `<span class="sig sig-${s}">${sigLabel(s)}</span>`
    ).join('');
    return `<tr>
      <td style="color:var(--muted);font-size:11px">${i + 1}</td>
      <td>
        <div class="tk">${p.ticker}</div>
        <div style="margin-top:3px"><span class="sector-badge s-${p.sector}">${p.sector}</span></div>
      </td>
      <td>
        <div class="score-wrap">
          <div class="score-bar-bg"><div class="score-bar-fill" style="width:${fillPct}%;background:${fillColor}"></div></div>
          <div class="score-num" style="color:${fillColor}">${sc}</div>
        </div>
      </td>
      <td><span class="trend-badge ${trendClass(p.trend)}">${p.trend}</span></td>
      <td>
        <div class="price">${p.close?.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})} ฿</div>
        <div style="margin-top:2px">${fmtChg(p.pct_change_1d)}</div>
      </td>
      <td><span class="rsi-chip ${rsiClass(p.rsi)}">${p.rsi ?? '—'}</span></td>
      <td>
        <div class="ind-row">
          <span class="ind ${p.supertrend_dir === 'BULL' ? 'ind-bull' : 'ind-bear'}">ST:${p.supertrend_dir}</span>
          <span class="ind ${p.ai_cluster === 'BULL' ? 'ind-bull' : p.ai_cluster === 'BEAR' ? 'ind-bear' : 'ind-neu'}">AI:${p.ai_cluster}</span>
          <span class="ind ${p.macd_bull ? 'ind-bull' : 'ind-bear'}">MACD</span>
          <span class="ind ${p.vol_surge ? 'ind-bull' : 'ind-neu'}">VOL</span>
          <span class="ind ind-neu">${p.ema_ribbon}</span>
        </div>
      </td>
      <td><div class="sigs">${sigHtml || '<span style="color:var(--muted);font-size:11px">—</span>'}</div></td>
      <td>
        <div class="sr-row">
          <span class="sr-res">▲ ${p.resistance?.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}) ?? '—'}</span>
          <span class="sr-sup">▼ ${p.support?.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}) ?? '—'}</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="width:28px">#</th>
          <th>Ticker</th>
          <th style="min-width:130px" class="sorted${sortKey==='score'?' ':sortAsc?' asc':''}" onclick="setSort('score')">Score</th>
          <th>Signal</th>
          <th class="${sortKey==='pct_change_1d'?'sorted'+(sortAsc?' asc':''):''}" onclick="setSort('pct_change_1d')">Price / 1D</th>
          <th class="${sortKey==='rsi'?'sorted'+(sortAsc?' asc':''):''}" onclick="setSort('rsi')">RSI</th>
          <th>Indicators</th>
          <th class="${sortKey==='signal_count'?'sorted'+(sortAsc?' asc':''):''}" onclick="setSort('signal_count')">Active Signals</th>
          <th>Res / Sup</th>
        </tr>
      </thead>
      <tbody>${tbody}</tbody>
    </table>`;

  buildSectorRibbon(getFilteredSorted());
}

function renderSectorPanel() {
  if (!DATA?.sector_summary?.length) return;
  const maxBuy = Math.max(...DATA.sector_summary.map(s => s.buy_count));
  const html = DATA.sector_summary.map(s => {
    const pct = maxBuy > 0 ? (s.buy_count / maxBuy) * 100 : 0;
    const col = SECTOR_COLORS[s.sector] || 'var(--green)';
    return `<div class="sector-card">
      <div class="sc-name" style="color:${col}">${s.sector}</div>
      <div class="sc-bar-bg"><div class="sc-bar-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="sc-stats"><span>${s.buy_count}</span> buy / ${s.total} · avg <span>${s.avg_score}</span></div>
    </div>`;
  }).join('');
  document.getElementById('sectorGrid').innerHTML = html;
  document.getElementById('sectorPanel').style.display = '';
}

function setTrend(t) {
  activeTrend = t;
  buildFilterTabs();
  renderTable();
}
function setSort(k) {
  if (sortKey === k) sortAsc = !sortAsc;
  else { sortKey = k; sortAsc = false; }
  buildFilterTabs();
  renderTable();
}
function setSector(s) {
  activeSector = s;
  buildSectorRibbon(getFilteredSorted());
  renderTable();
}

async function init() {
  try {
    const res = await fetch('data/lux-scanner.json?t=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch (e) {
    document.getElementById('tableWrap').innerHTML =
      `<div class="empty">Could not load scan data. Run the scanner or check the build log.<br><small style="color:var(--muted)">${e}</small></div>`;
    return;
  }

  // Freshness
  const { txt, warn } = freshnessLabel(DATA.built_at);
  document.getElementById('staleBadge').textContent = txt;
  document.getElementById('staleBadge').className = 'stale' + (warn ? ' warn' : '');
  document.getElementById('meta').textContent =
    `Scan date: ${DATA.scan_date} · ${DATA.total_scanned} tickers · ${DATA.scan_elapsed_s}s`;

  // Stats bar
  const bp = DATA.buy_pct ?? 0;
  document.getElementById('sScanned').textContent = DATA.total_scanned ?? '—';
  document.getElementById('sBuy').textContent = DATA.buy_signals ?? '—';
  document.getElementById('sStrongBuy').textContent = DATA.strong_buy_signals ?? '—';
  document.getElementById('sBuyPct').textContent = bp.toFixed(1) + '%';
  document.getElementById('sBuyPct').className = 'stat-val ' + (bp >= 25 ? 'green' : bp >= 15 ? 'yellow' : 'red');
  document.getElementById('sAvgScore').textContent = DATA.avg_score ?? '—';
  const tone = DATA.market_tone || '—';
  document.getElementById('sTone').textContent = tone;
  const toneCol = tone.includes('BULLISH') ? 'green' : tone === 'NEUTRAL' ? 'yellow' : 'red';
  document.getElementById('sTone').className = 'stat-val ' + toneCol;

  // AI brief
  if (DATA.ai_summary) {
    document.getElementById('aiText').textContent = DATA.ai_summary;
    document.getElementById('aiBrief').classList.remove('empty');
  }

  buildFilterTabs();
  buildSectorRibbon(DATA.picks);
  renderTable();
  renderSectorPanel();
}

init();
</script>
</body>
</html>
