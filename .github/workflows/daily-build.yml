name: Daily Coverage Build

# Runs the 4-route SETSMART scan, regenerates JSON snapshots in data/,
# and commits them. Cloudflare Pages auto-deploys on push to main.
#
# Schedule: 02:50 UTC = 09:50 Bangkok (UTC+7), Mon-Fri
# Manual:   workflow_dispatch lets you trigger from the Actions tab anytime.

on:
  schedule:
    - cron: '50 2 * * 1-5'
  workflow_dispatch:

# Allow this job to push commits back to the repo
permissions:
  contents: write

# Cancel any in-flight run if a new one starts
concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # token persists for the push step at the end
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily build (~15 min)
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}
          PYTHONIOENCODING: utf-8
          # SURVEILLANCE_DB_PATH intentionally unset — disclosure-pulse falls back
          # to live SET news polling. Step 3 will populate it from R2.
        run: python scripts/build_daily.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "daily snapshot $(date -u +%Y-%m-%d)"
          git push origin main

      - name: Upload build status as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-status-${{ github.run_id }}
          path: data/build-status.json
          if-no-files-found: ignore
          retention-days: 14
