# Cloudflare Worker that dispatches IS1 build workflows via GitHub's
# workflow_dispatch API. Deployed separately from the dashboard Pages site;
# this Worker has no public assets and is invoked only by Cron Triggers.
#
# Deploy:    wrangler deploy
# Secrets:   wrangler secret put GITHUB_TOKEN
#            wrangler secret put HEALTHCHECK_URL_DAILY      # optional
#            wrangler secret put HEALTHCHECK_URL_DISCLOSURE # optional
#            wrangler secret put MANUAL_TRIGGER_TOKEN       # optional, for /fetch test

name = "is1-coverage-dispatcher"
main = "worker.js"
compatibility_date = "2026-05-01"

# Cloudflare Cron Triggers — replaces GitHub Actions `schedule:` events which
# are documented as best-effort and have been observed dropping/delaying
# runs multi-hour on this repo. Cloudflare fires within seconds of the
# scheduled minute.
#
# worker.js routes each cron to the corresponding workflow via CRON_TO_WORKFLOW.
# Times below are UTC; conversions to Bangkok (UTC+7) shown for review.
#
# The account is on the Workers Free plan, which allows 5 cron triggers per
# account. whoop-health-desk holds 2, so this worker keeps exactly 3. A fourth
# trigger is rejected (Cloudflare code 10072) and leaves the live crons stale.
# The annual filing-deadline dates (16 Aug, 16 Nov, 1 Mar, 16 May, formerly
# 02:30 UTC) are folded into the 02:15 UTC MON-FRI run in worker.js. A filing
# date that falls on Saturday or Sunday is dispatched on the next Monday
# 02:15 UTC run, the first morning run after that date.
#
# Cloudflare numbers weekdays 1=Sunday through 7=Saturday. A range of 1-5 is
# Sunday-Thursday and never fires on Friday, so the morning brief then waits
# for the later GitHub backup (and a Sunday run fires as well). MON-FRI is
# Monday-Friday. GitHub Actions cron is the other convention (1=Monday) and
# its backup expressions stay 1-5 on purpose.
[triggers]
crons = [
  "15 2 * * MON-FRI", # 02:15 UTC / 09:15 BKK Mon-Fri → daily.yml, plus a filing prompt on deadline dates
  "0 7 * * MON-FRI",  # 07:00 UTC / 14:00 BKK Mon-Fri → disclosure-refresh.yml (afternoon)
  "0 11 * * MON-FRI", # 11:00 UTC / 18:00 BKK Mon-Fri → disclosure-refresh.yml (end-of-day)
]

[vars]
GITHUB_OWNER = "tasinpongk-jpg"
GITHUB_REPO = "is1-coverage-dashboard"
GITHUB_REF = "main"

# Observability: send Worker invocation logs to Cloudflare for `wrangler tail`
# inspection and dashboard troubleshooting. Free tier includes 100k events/day,
# far more than this Worker's ~66 invocations/month will use.
[observability]
enabled = true
