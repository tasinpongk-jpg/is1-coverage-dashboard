name: Worker tests

# Fast guard for the chat API: stubbed env, no Cloudflare access needed.
# Runs only when the worker, dock, tests, or snapshot schema change.
on:
  push:
    paths:
      - "worker.js"
      - "chat-dock.js"
      - "nav.js"
      - "theme.css"
      - "*.html"
      - "surveillance/**"
      - "tests/**"
      - ".github/workflows/worker-test.yml"
  pull_request:
    paths:
      - "worker.js"
      - "chat-dock.js"
      - "nav.js"
      - "theme.css"
      - "*.html"
      - "surveillance/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: node --check worker.js && node --check chat-dock.js && node --check nav.js
      - name: Run worker tests
        run: node --test tests/*.test.mjs
      - name: Run Form 59 parser tests
        run: |
          python -m pip install duckdb==1.5.2 httpx==0.27.2
          python -m unittest tests/test_form59.py
