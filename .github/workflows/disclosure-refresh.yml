name: Disclosure Pulse Refresh (intra-day)

# Lightweight intra-day refresh of data/disclosure-pulse.json only.
#
# Runs twice daily, Mon-Fri:
#   14:00 BKK (07:00 UTC) — early afternoon catch-up for morning filings
#                            posted after the 09:50 daily build.
#   18:00 BKK (11:00 UTC) — end-of-day sweep for after-market filings
#                            (SET closes 16:30 BKK; companies often file
#                            material disclosures shortly after).
# The morning daily.yml at 09:50 BKK still does the full pipeline
# (surveillance + emails + all 4 routes + commit). This job just picks
# up new disclosures and commits ONLY disclosure-pulse.json — no emails,
# no SETSMART scan, no touching the other 3 dashboards.
#
# Concurrency: same `daily` group as daily.yml, so the two workflows
# never run simultaneously. If a long-running morning build is still in
# flight at 14:00, this job queues behind it and the main pipeline is
# never interrupted.
#
# Secrets required: ANTHROPIC_API_KEY (classify), SURVEILLANCE_SQL (build),
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET.
#
# Secrets explicitly NOT used here: SETSMART_API_KEY (disclosure-pulse is a
#   DuckDB query, not a SETSMART scan), EMAIL_USERNAME/EMAIL_APP_PASSWORD/
#   EMAIL_FROM/EMAIL_TO (no emails fire from this workflow).

on:
  schedule:
    - cron: '0 7 * * 1-5'     # 14:00 BKK — afternoon catch-up
    - cron: '0 11 * * 1-5'    # 18:00 BKK — end-of-day sweep
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to look back when polling (default 1 for scheduled runs; bump for backfills)."
        required: false
        default: "1"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SURVEILLANCE_DB_PATH: /tmp/surveillance.duckdb
      PYTHONUTF8: '1'
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      # Discord RM digest switch — promote both via env so step-level
      # `if:` conditions can reference them (GitHub does not allow direct
      # secrets.* in `if:`; pass through job-level env first).
      DISCORD_PUSH_ENABLED: ${{ vars.DISCORD_PUSH_ENABLED || 'false' }}
      DISCORD_PUSH_WEBHOOK: ${{ secrets.DISCORD_PUSH_WEBHOOK }}
      RM_NAME: ${{ vars.RM_NAME || 'C' }}
      SEVERITY_MIN: ${{ vars.SEVERITY_MIN || 'low' }}
      DISCORD_USERNAME: ${{ vars.DISCORD_USERNAME || 'IS1 Disclosure Pulse' }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # actions/checkout pins the SHA at queue time, not execution time.
      # When this job waits in the concurrency queue behind daily.yml (~18 min),
      # it wakes up on a stale commit. Reset to the true HEAD so our
      # disclosure-pulse.json is built on top of whatever daily.yml pushed.
      - name: Sync to latest HEAD
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            surveillance/requirements.txt
            requirements.txt

      - name: Install dependencies
        run: |
          pip install -r surveillance/requirements.txt
          pip install -r requirements.txt

      - name: Download surveillance.duckdb from R2
        run: python surveillance/r2_sync.py download

      - name: Poll SET disclosures
        working-directory: surveillance
        run: python poll.py --lookback-days ${{ github.event.inputs.lookback_days || '1' }}

      - name: Classify new items (rules first, Groq free-tier fall-through)
        working-directory: surveillance
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python classify_batch.py

      - name: Upload updated DuckDB back to R2
        run: python surveillance/r2_sync.py upload

      - name: Regenerate disclosure-pulse.json (no SETSMART scan)
        env:
          SURVEILLANCE_SQL: ${{ secrets.SURVEILLANCE_SQL }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build_daily.py --route disclosure-pulse

      - name: Commit and push if disclosure-pulse changed
        # Only push from main. Manual dispatches from feature branches
        # exercise the full refresh without trying to push.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/disclosure-pulse.json
          if git diff --staged --quiet; then
            echo "No disclosure-pulse changes — skipping commit."
            exit 0
          fi
          git commit -m "disclosure refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — rebasing and retrying..."
            # Abort any in-progress rebase before starting a fresh one.
            # Without this, a prior conflict leaves unmerged files and the
            # next `git pull --rebase` fails immediately with "unresolved
            # conflict" instead of actually rebasing.
            git rebase --abort 2>/dev/null || true
            if ! git pull --rebase origin main; then
              # Conflict on disclosure-pulse.json: our rebuilt version is
              # fresher (newer DuckDB data). Accept ours and continue.
              git checkout --theirs data/disclosure-pulse.json
              git add data/disclosure-pulse.json
              GIT_EDITOR=true git rebase --continue
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1

      # Email-on-failure. Pure stdlib so it still works if the surveillance
      # codebase itself is the thing that broke. Common triggers we've hit:
      # invalid ANTHROPIC_API_KEY (silent 401), Anthropic spend cap, SET portal
      # Imperva 4xx, R2 sync timeout.
      - name: Notify on failure (refresh)
        if: failure()
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/notify_failure.py
        continue-on-error: true

      # Discord digest for the IS1 user (RM C / Champ). Runs AFTER the
      # upstream data/disclosure-pulse.json commit so we only push for
      # filings that actually shipped to the dashboard. Branches:
      #   (a) push.py writes data/rm_c_push_state.json (per-batch persisted)
      #   (b) this step commits + pushes the state file back to main
      # On a feature branch the upstream commit is skipped (see line 120);
      # we mirror that gate so feature-branch dispatches do not push to
      # Discord or pollute main with state edits.
      # Gate: env.DISCORD_PUSH_ENABLED must be exactly 'true' AND webhook
      # secret must be set (we don't trust a missing secret — the script
      # would dry-run forever, masking misconfiguration).
      - name: Push RM disclosures digest to Discord
        if: github.ref == 'refs/heads/main' && env.DISCORD_PUSH_ENABLED == 'true' && env.DISCORD_PUSH_WEBHOOK != ''
        env:
          DISCORD_PUSH_WEBHOOK: ${{ secrets.DISCORD_PUSH_WEBHOOK }}
          RM_NAME: ${{ vars.RM_NAME || 'C' }}
          SEVERITY_MIN: ${{ vars.SEVERITY_MIN || 'low' }}
          DISCORD_USERNAME: ${{ vars.DISCORD_USERNAME || 'IS1 Disclosure Pulse' }}
        run: python scripts/push_rm_c_digest.py

      # Commit + push the dedup state file written by push.py. Atomic
      # add-and-push; if push fails (concurrent run, RACE), the next run
      # will see the same state and dedup correctly — at-least-once.
      # Idempotent: if no state changed, this step exits 0 silently.
      - name: Commit and push RM push state
        if: github.ref == 'refs/heads/main' && env.DISCORD_PUSH_ENABLED == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rm_c_push_state.json
          if git diff --staged --quiet; then
            echo "No state changes — skipping commit."
            exit 0
          fi
          git commit -m "rm push state $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "State push succeeded on attempt $attempt."
              exit 0
            fi
            echo "State push attempt $attempt rejected — rebasing and retrying..."
            git rebase --abort 2>/dev/null || true
            if ! git pull --rebase origin main; then
              git checkout --theirs data/rm_c_push_state.json
              git add data/rm_c_push_state.json
              GIT_EDITOR=true git rebase --continue
            fi
            sleep $((attempt * 5))
          done
          echo "State push failed after 3 attempts — will retry next run."
          exit 0  # non-fatal; main push already succeeded
