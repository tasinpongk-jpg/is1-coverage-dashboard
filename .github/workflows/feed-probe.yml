# TEMPORARY: probes candidate RSS feeds from a GitHub runner. Removed before merge.
name: feed-probe
on:
  pull_request:
    paths: [".github/workflows/feed-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install httpx==0.27.2 duckdb==1.5.2
      - name: Probe
        working-directory: surveillance
        run: |
          python - <<'PY'
          import httpx, external_sources as es
          C = [
            ("THANSETTAKIJ", "https://www.thansettakij.com/rss"),
            ("THANSETTAKIJ", "https://www.thansettakij.com/rss.xml"),
            ("THANSETTAKIJ", "https://www.thansettakij.com/feed"),
            ("THANSETTAKIJ", "https://www.thansettakij.com/rss/money_market"),
            ("BANGKOKPOST", "https://www.bangkokpost.com/rss/data/business.xml"),
            ("BANGKOKPOST", "https://www.bangkokpost.com/rss/data/property.xml"),
            ("INVESTING_TH", "https://th.investing.com/rss/news.rss"),
            ("INVESTING_TH", "https://th.investing.com/rss/news_25.rss"),
            ("BANGKOKBIZ", "https://www.bangkokbiznews.com/rss/business"),
            ("BANGKOKBIZ", "https://www.bangkokbiznews.com/rss/feed.xml"),
            ("KAOHOON", "https://www.kaohoon.com/feed"),
          ]
          with httpx.Client(headers=es.HEADERS, timeout=es.TIMEOUT, follow_redirects=True) as c:
              for src, url in C:
                  try:
                      r = c.get(url)
                      items = es._parse_rss(r.text) if r.status_code == 200 else []
                      lang = "en" if src == "BANGKOKPOST" else "th"
                      hits = sum(1 for i in items if es.find_tickers(f"{i.get('title','')}\n{i.get('description','')}", lang))
                      first = (items[0].get("title", "") if items else "")[:70]
                      print(f"PROBE {src} {url} status={r.status_code} ct={r.headers.get('content-type','')[:30]} final={r.url} items={len(items)} hits={hits} first={first!r}")
                  except Exception as e:
                      print(f"PROBE {src} {url} ERROR {type(e).__name__}: {e}")
          PY
