name: SET people probe (read-only)

# Temporary: prints what the SET API returns for board and major-shareholder
# endpoints so the builder can be written against the real shape. Writes and
# commits nothing. Delete once build_company_people.py exists.

on:
  push:
    branches: [claude/charming-goldberg-tt6v7y]
    paths:
      - scripts/probe_set_people.py
      - .github/workflows/set-people-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe SET API
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/probe_set_people.py
