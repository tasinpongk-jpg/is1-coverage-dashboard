<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>eFinanceThai News — IS1 Team</title>
<script src="theme.js?v=8"></script><link rel="stylesheet" href="theme.css?v=8"><script src="i18n.js?v=9"></script>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}
.page{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:28px 0 72px}.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:32px;padding:0 0 22px;border-bottom:1px solid var(--border)}.header-copy{min-width:0}
.eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:11px;color:var(--green);font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(53,201,121,.1)}
h1{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.025em}.lead{max-width:690px;margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.65}.header-actions{display:flex;gap:8px;flex:0 0 auto;padding-top:4px}
.button{display:inline-flex;min-height:40px;align-items:center;justify-content:center;gap:8px;padding:0 14px;color:var(--text);background:var(--card);border:1px solid var(--border2);border-radius:9px;text-decoration:none;font-size:12px;font-weight:700;cursor:pointer;transition:border-color .16s ease,background .16s ease}.button:hover{border-color:var(--green);background:var(--surface-hover)}.button.primary{color:#07140d;background:var(--green);border-color:var(--green)}.button:disabled{opacity:.55;cursor:wait}.button svg{width:15px;height:15px;flex:0 0 auto}
.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:14px;align-items:center;margin:18px 0 10px;padding:10px 0}.search-wrap{position:relative;display:block}.search-icon{position:absolute;left:13px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--dim);pointer-events:none}.search{width:100%;min-height:42px;padding:0 13px 0 40px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:9px;outline:none}.search::placeholder{color:var(--dim)}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filter-group{display:flex;gap:4px;padding:4px;background:var(--panel2);border:1px solid var(--border);border-radius:9px}.filter{min-height:32px;padding:0 11px;color:var(--muted);background:transparent;border:0;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700}.filter:hover{color:var(--text)}.filter.active{color:var(--text);background:var(--card2);box-shadow:var(--shadow-sm)}
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px;margin-bottom:8px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--border)}.statusbar strong{color:var(--text)}.source-note{display:flex;align-items:center;gap:7px;text-align:right}.source-note svg{width:14px;height:14px;flex:0 0 auto;color:var(--green)}
.dashboard-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:34px;align-items:start}.news-stream{min-width:0}.feed-group{margin-bottom:18px}.group-heading{display:flex;align-items:center;gap:10px;margin:0;padding:18px 0 9px;color:var(--muted);font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.11em;text-transform:uppercase}.group-heading::after{content:"";height:1px;flex:1;background:var(--border)}
.story{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:15px;padding:22px 2px 23px;border-bottom:1px solid var(--border);scroll-margin-top:24px}.story:target{background:var(--accent-soft);box-shadow:0 0 0 10px var(--accent-soft);border-color:var(--accent-border)}.story-number{padding-top:4px;color:var(--dim);font:600 11px/1 'JetBrains Mono',monospace}.story-main{min-width:0}.story-title{margin:0;font-size:17px;line-height:1.5;font-weight:600;letter-spacing:-.006em}.story-title a{color:var(--text);text-decoration:none}.story-title a:hover{color:var(--green)}
.story-meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:8px 0 0;color:var(--muted);font-size:11px}.story-meta time{font-family:'JetBrains Mono',monospace;font-size:10px}.ticker{display:inline-flex;align-items:center;min-height:21px;padding:0 7px;color:#07140d;background:var(--green);border-radius:5px;font:700 9px/1 'JetBrains Mono',monospace;letter-spacing:.04em}
.summary-block{margin-top:15px}.summary-label{display:flex;align-items:center;gap:6px;margin-bottom:7px;color:var(--green);font:700 9px/1 'JetBrains Mono',monospace;letter-spacing:.09em;text-transform:uppercase}.summary-label svg{width:13px;height:13px}.summary-list{display:grid;gap:5px;margin:0;padding:0;list-style:none;color:var(--text2);font-size:13px;line-height:1.55}.summary-list li{position:relative;padding-left:16px}.summary-list li::before{content:"";position:absolute;left:1px;top:.7em;width:4px;height:4px;border-radius:50%;background:var(--green)}
.summary-list.is-loading li{min-height:1.25em;overflow:hidden}.summary-list.is-loading li::before{display:none}.summary-list.is-loading li::after{content:"";display:block;width:var(--skeleton-width,88%);height:9px;margin-top:5px;background:var(--border);border-radius:4px;animation:pulse 1.4s ease-in-out infinite}.summary-list.is-loading li:nth-child(2){--skeleton-width:74%}.summary-list.is-loading li:nth-child(3){--skeleton-width:61%}
.open-article{display:grid;place-items:center;width:34px;height:34px;margin-top:1px;color:var(--green);border:1px solid var(--border);border-radius:8px;text-decoration:none}.open-article:hover{color:var(--text);border-color:var(--green);background:rgba(53,201,121,.07)}.open-article svg{width:15px;height:15px}
.headline-index{position:sticky;top:22px;margin-top:18px;padding-left:20px;border-left:1px solid var(--border)}.index-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.index-title{margin:0;color:var(--text);font-size:12px;font-weight:700}.index-count{color:var(--muted);font:600 10px/1 'JetBrains Mono',monospace}.index-list{display:grid;gap:2px;margin:0;padding:0;list-style:none}.index-link{display:grid;grid-template-columns:25px minmax(0,1fr);gap:7px;padding:7px 5px;color:var(--muted);border-radius:6px;text-decoration:none;font-size:11px;line-height:1.4}.index-link:hover{color:var(--text);background:var(--surface-hover)}.index-number{color:var(--dim);font:600 9px/1.55 'JetBrains Mono',monospace}.index-link span:last-child{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}.index-source{margin:16px 5px 0;padding-top:13px;color:var(--dim);border-top:1px solid var(--border);font-size:10px;line-height:1.55}.index-source a{color:var(--green);text-decoration:none}
.state{display:grid;place-items:center;min-height:260px;padding:36px;color:var(--muted);text-align:center;border-bottom:1px solid var(--border)}.state strong{display:block;margin-bottom:10px;color:var(--text);font-size:15px}.loader{width:25px;height:25px;margin:0 auto 14px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.loader,.summary-list.is-loading li::after{animation-duration:2.4s}.button{transition:none}}@media(max-width:980px){.dashboard-layout{grid-template-columns:minmax(0,1fr)}.headline-index{display:none}}@media(max-width:720px){.page{width:min(100% - 24px,1240px);padding-top:18px}.page-header{display:block;padding-bottom:18px}.header-actions{margin-top:18px;padding-top:0}.header-actions .button{flex:1}.toolbar{grid-template-columns:1fr;gap:8px;margin-top:10px}.filter-group{overflow-x:auto}.filter{flex:1 0 auto}.statusbar{align-items:flex-start;flex-direction:column;gap:5px;padding:6px 0 10px}.source-note{text-align:left}.story{grid-template-columns:29px minmax(0,1fr);gap:9px;padding:19px 0 21px}.open-article{display:none}.story-title{font-size:15px;line-height:1.52}.summary-list{font-size:12px}.group-heading{padding-top:16px}}
</style>
</head>
<body>
<main class="page"><header class="page-header"><div class="header-copy"><div class="eyebrow"><span class="live-dot"></span><span data-i18n="efin.liveSource">Live source</span> · eFinanceThai</div><h1 data-i18n="page.efinanceNews">eFinanceThai News</h1><p class="lead" data-i18n="meta.efinanceNews">Latest Thai market headlines with direct links and three-point Thai summaries.</p></div><div class="header-actions"><button class="button primary" id="refreshBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6v6h-6"/><path d="M4 18v-6h6"/><path d="M18.5 9A7 7 0 0 0 6.2 6.2L4 8"/><path d="M5.5 15A7 7 0 0 0 17.8 17.8L20 16"/></svg><span data-i18n="efin.refresh">Refresh</span></button><a class="button" href="https://www.efinancethai.com/LastestNews/AllLatestNews.aspx" target="_blank" rel="noopener noreferrer"><span data-i18n="efin.openSource">Open source</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 5h5v5"/><path d="M10 14 19 5"/><path d="M19 14v5H5V5h5"/></svg></a></div></header>
<section class="toolbar" aria-label="News filters"><label class="search-wrap"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><span class="sr-only" data-i18n="common.search">Search</span><input class="search" id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="efin.searchPlaceholder" placeholder="Search headline or ticker…"></label><div class="filter-group" role="group" aria-label="Headline type"><button class="filter active" type="button" data-filter="all" aria-pressed="true" data-i18n="efin.allNews">All news</button><button class="filter" type="button" data-filter="ticker" aria-pressed="false" data-i18n="efin.tickerNews">Ticker-tagged</button></div></section>
<div class="statusbar" id="statusbar" aria-live="polite"><span data-i18n="common.loading">Loading…</span></div><div class="dashboard-layout"><section class="news-stream" id="feed" aria-live="polite" aria-busy="true"><div class="state"><div><div class="loader"></div><span data-i18n="efin.fetching">Fetching latest headlines…</span></div></div></section><aside class="headline-index" aria-labelledby="quickNavHeading"><div class="index-heading"><h2 class="index-title" id="quickNavHeading" data-i18n="efin.quickNav">Quick navigation</h2><span class="index-count" id="indexCount">0</span></div><ol class="index-list" id="indexList"></ol><p class="index-source"><span data-i18n="efin.sourceCredit">Source:</span> <a href="https://www.efinancethai.com/LastestNews/AllLatestNews.aspx" target="_blank" rel="noopener noreferrer">eFinanceThai</a></p></aside></div></main>
<script>
(()=>{'use strict';
let items=[],payload=null,activeFilter='all',query='',summaries=new Map(),summariesLoading=false,summariesFailed=false;
const feed=document.getElementById('feed'),statusbar=document.getElementById('statusbar'),refreshBtn=document.getElementById('refreshBtn'),searchInput=document.getElementById('searchInput'),filters=[...document.querySelectorAll('[data-filter]')],indexList=document.getElementById('indexList'),indexCount=document.getElementById('indexCount');
const fallback={'common.loading':'Loading…','efin.fetching':'Fetching latest headlines…','efin.headlines':'{n} headlines','efin.tickerTagged':'{n} ticker-tagged','efin.lastFetched':'Fetched {time}','efin.noMatches':'No headlines match these filters.','efin.tryAgain':'Could not load the live feed. Try again.','efin.sourceNote':'Thai summaries are generated from each article · verify details at source','efin.openArticle':'Open article','efin.latest':'Latest','efin.earlierToday':'Earlier','efin.summaryTitle':'3-point summary','efin.summaryLoading':'Preparing Thai summaries…','efin.summaryUnavailable1':'ยังไม่สามารถโหลดสรุปข่าวรอบนี้ได้','efin.summaryUnavailable2':'พาดหัวข่าวยังคงเชื่อมไปยังบทความต้นฉบับ','efin.summaryUnavailable3':'กรุณาเปิดต้นฉบับเพื่อตรวจสอบรายละเอียดทั้งหมด'};
const tt=key=>window.I18N?I18N.t(key):(fallback[key]||key),tx=(key,vars)=>tt(key).replace(/\{(\w+)\}/g,(_,k)=>vars?.[k]??''),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function safeUrl(value){try{const url=new URL(String(value||'')),validHost=url.hostname==='www.efinancethai.com'||url.hostname==='efinancethai.com';return url.protocol==='https:'&&validHost&&/^\/LastestNews\/LatestNewsMain\.aspx$/i.test(url.pathname)?url.href:''}catch{return''}}
function locale(){return document.documentElement.lang==='th'?'th-TH':'en-GB'}function formatTime(value){if(!value)return'';const date=new Date(value);if(Number.isNaN(date.getTime()))return'';return new Intl.DateTimeFormat(locale(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}).format(date)}
function visibleItems(){const needle=query.trim().toLocaleLowerCase();return items.filter(item=>{if(activeFilter==='ticker'&&!item.ticker)return false;if(!needle)return true;return String(item.title||'').toLocaleLowerCase().includes(needle)||String(item.ticker||'').toLocaleLowerCase().includes(needle)})}
function summaryBullets(item){const record=summaries.get(String(item.id));if(record?.length===3)return record;if(summariesLoading)return null;return[tt('efin.summaryUnavailable1'),tt('efin.summaryUnavailable2'),tt('efin.summaryUnavailable3')]}
function summaryMarkup(item){const bullets=summaryBullets(item);if(!bullets)return `<div class="summary-block" aria-label="${esc(tt('efin.summaryLoading'))}"><div class="summary-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 3 1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></svg>${esc(tt('efin.summaryTitle'))}</div><ul class="summary-list is-loading" aria-hidden="true"><li></li><li></li><li></li></ul></div>`;return `<div class="summary-block"><div class="summary-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 3 1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></svg>${esc(tt('efin.summaryTitle'))}</div><ul class="summary-list" lang="th">${bullets.map(bullet=>`<li>${esc(bullet)}</li>`).join('')}</ul></div>`}
function storyMarkup(item,index){const url=safeUrl(item.url);if(!url)return'';const ticker=item.ticker?`<span class="ticker">${esc(item.ticker)}</span>`:'',time=formatTime(item.publishedAt);return `<article class="story" id="news-${esc(item.id)}"><div class="story-number">${String(index+1).padStart(2,'0')}</div><div class="story-main"><h3 class="story-title"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h3><div class="story-meta">${ticker}${time?`<time datetime="${esc(item.publishedAt)}">${esc(time)}</time>`:''}<span>eFinanceThai</span></div>${summaryMarkup(item)}</div><a class="open-article" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="${esc(tt('efin.openArticle'))}" aria-label="${esc(tt('efin.openArticle'))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 5h5v5"/><path d="M10 14 19 5"/><path d="M19 14v5H5V5h5"/></svg></a></article>`}
function groupMarkup(titleKey,rows,offset){if(!rows.length)return'';return `<section class="feed-group"><h2 class="group-heading">${esc(tt(titleKey))}</h2>${rows.map((item,index)=>storyMarkup(item,offset+index)).join('')}</section>`}
function updateStatus(rows){const tagged=items.filter(item=>item.ticker).length,summaryState=summariesLoading?` · ${esc(tt('efin.summaryLoading'))}`:summariesFailed?` · ${esc(tt('efin.summaryUnavailable1'))}`:'';statusbar.innerHTML=`<span><strong>${esc(tx('efin.headlines',{n:rows.length}))}</strong> · ${esc(tx('efin.tickerTagged',{n:tagged}))}${summaryState}</span><span class="source-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>${esc(tt('efin.sourceNote'))}${payload?.fetchedAt?` · ${esc(tx('efin.lastFetched',{time:formatTime(payload.fetchedAt)}))}`:''}</span>`}
function updateIndex(rows){indexCount.textContent=String(rows.length).padStart(2,'0');indexList.innerHTML=rows.map((item,index)=>`<li><a class="index-link" href="#news-${esc(item.id)}"><span class="index-number">${String(index+1).padStart(2,'0')}</span><span>${esc(item.title)}</span></a></li>`).join('')}
function render(){const rows=visibleItems();updateStatus(rows);updateIndex(rows);if(!rows.length){feed.innerHTML=`<div class="state"><div><strong>${esc(tt('efin.noMatches'))}</strong></div></div>`;feed.setAttribute('aria-busy','false');return}const latestCount=Math.min(3,rows.length);feed.innerHTML=groupMarkup('efin.latest',rows.slice(0,latestCount),0)+groupMarkup('efin.earlierToday',rows.slice(latestCount),latestCount);feed.setAttribute('aria-busy',String(summariesLoading))}
async function loadSummaries(){summariesLoading=true;summariesFailed=false;render();try{const response=await fetch('./api/efinance-news/summaries',{headers:{Accept:'application/json'}}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);summaries=new Map((Array.isArray(data.summaries)?data.summaries:[]).filter(record=>Array.isArray(record.bullets)&&record.bullets.length===3).map(record=>[String(record.id),record.bullets]))}catch(error){summariesFailed=true;console.error('eFinanceThai summaries failed',error)}finally{summariesLoading=false;render()}}
async function loadNews(){refreshBtn.disabled=true;feed.setAttribute('aria-busy','true');if(!items.length)feed.innerHTML=`<div class="state"><div><div class="loader"></div>${esc(tt('efin.fetching'))}</div></div>`;try{const response=await fetch('./api/efinance-news',{headers:{Accept:'application/json'}}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);payload=data;items=Array.isArray(data.items)?data.items:[];summaries=new Map();summariesLoading=true;render();await loadSummaries()}catch(error){console.error('eFinanceThai feed failed',error);feed.innerHTML=`<div class="state"><div><strong>${esc(tt('efin.tryAgain'))}</strong><button class="button" id="retryBtn" type="button">${esc(tt('efin.refresh'))}</button></div></div>`;feed.setAttribute('aria-busy','false');document.getElementById('retryBtn')?.addEventListener('click',loadNews);updateStatus([]);updateIndex([])}finally{refreshBtn.disabled=false}}
searchInput.addEventListener('input',event=>{query=event.target.value;render()});filters.forEach(button=>button.addEventListener('click',()=>{activeFilter=button.dataset.filter;filters.forEach(candidate=>{const active=candidate===button;candidate.classList.toggle('active',active);candidate.setAttribute('aria-pressed',String(active))});render()}));refreshBtn.addEventListener('click',loadNews);window.addEventListener('i18n:change',()=>{if(window.I18N)I18N.apply();render()});loadNews()})();
</script>
<script src="nav.js?v=9" defer></script><script src="chat-dock.js?v=8" defer></script>
</body></html>
