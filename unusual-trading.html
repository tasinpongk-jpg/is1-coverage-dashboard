<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unusual Trading — IS1 Team</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e2e8f0;
    --muted: #7c8298; --accent: #6366f1; --green: #22c55e; --red: #ef4444;
    --yellow: #f59e0b; --orange: #fb923c;
    --food: #3b82f6; --prop: #8b5cf6; --pfreit: #06b6d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { font-size: 16px; font-weight: 600; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .nav { display: flex; gap: 14px; align-items: center; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  .nav a:hover { color: var(--text); background: var(--border); }
  .nav a.active { color: var(--text); background: #6366f122; border: 1px solid #6366f155; }
  .stale { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #22c55e22; color: var(--green); border: 1px solid #22c55e33; }
  .stale.warn { background: #f59e0b22; color: var(--yellow); border-color: #f59e0b33; }

  .tab-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tab-row { display: flex; gap: 4px; padding: 8px 0; align-items: center; flex-wrap: wrap; }
  .tab-row + .tab-row { border-top: 1px dashed var(--border); }
  .tab-label { font-size: 11px; color: var(--muted); margin-right: 8px; min-width: 60px; }
  .tab { padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted); border: 1px solid transparent; user-select: none; }
  .tab:hover { color: var(--text); background: #2a2d3a; }
  .tab.active { background: #6366f122; border-color: #6366f155; color: var(--text); font-weight: 600; }
  .tab-count { color: var(--muted); margin-left: 4px; font-size: 10px; }

  .stats { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .stat { flex: 1; text-align: center; padding: 10px; border-right: 1px solid var(--border); }
  .stat:last-child { border-right: none; }
  .stat-val { font-size: 18px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: var(--muted); }

  .grid { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .alert-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; position: relative; overflow: hidden; }
  .alert-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .alert-card.high::before { background: var(--red); }
  .alert-card.medium::before { background: var(--yellow); }
  .alert-card.low::before { background: var(--green); }
  .alert-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .alert-tk { font-size: 18px; font-weight: 800; letter-spacing: .5px; }
  .alert-tk-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sev-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
  .sev-high { background: #ef444433; color: var(--red); }
  .sev-medium { background: #f59e0b33; color: var(--yellow); }
  .sev-low { background: #22c55e22; color: var(--green); }
  .sector-badge, .rm-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  .s-FOOD, .s-AGRI { background: #3b82f622; color: var(--food); }
  .s-PROP, .s-CONS, .s-CONMAT { background: #8b5cf622; color: var(--prop); }
  .s-PFREIT { background: #06b6d422; color: var(--pfreit); }
  .rm-badge { background: #6366f122; color: #a5b4fc; }
  .alert-type { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .alert-label { font-size: 20px; font-weight: 800; color: var(--orange); }
  .alert-evidence { margin-top: 8px; background: var(--bg); border-radius: 6px; padding: 8px 10px; }
  .ev-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 1px 0; }
  .ev-row span:last-child { color: var(--text); font-weight: 500; }
  .filings-linked { margin-top: 6px; font-size: 11px; color: var(--yellow); }
  /* News backing: an alert with no filing or news behind it is the one to look at first. */
  .explain-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .explain-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border:1px solid var(--border); border-radius:999px; color:var(--muted); background:transparent; font:inherit; font-size:11.5px; font-weight:600; cursor:pointer; }
  .explain-chip b { font-variant-numeric:tabular-nums; }
  .explain-chip.active { color:var(--text); border-color:var(--yellow); background:color-mix(in srgb,var(--yellow) 12%,transparent); }
  .explain-chip.none.active { border-color:var(--red); background:color-mix(in srgb,var(--red) 12%,transparent); }
  .alert-card.unexplained { box-shadow: inset 0 0 0 1px color-mix(in srgb,var(--red) 35%,transparent); }
  .no-news { display:flex; flex-direction:column; align-items:flex-start; gap:2px; margin-top:10px; padding:7px 10px; border-radius:7px; color:var(--red); background:color-mix(in srgb,var(--red) 9%,transparent); font-size:11.5px; font-weight:700; }
  .no-news small { color:var(--muted); font-weight:500; }
  .news-backing { margin-top:10px; padding-top:8px; border-top:1px dashed var(--border); display:flex; flex-direction:column; gap:5px; }
  .news-backing a { display:grid; grid-template-columns:auto minmax(0,1fr); gap:7px; color:var(--text2); font-size:11.5px; line-height:1.4; text-decoration:none; }
  .news-backing a:hover { color:var(--text); }
  .news-backing em { font-style:normal; font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:4px; color:var(--yellow); background:color-mix(in srgb,var(--yellow) 12%,transparent); align-self:start; }
  .news-backing em.ext { color:var(--blue); background:color-mix(in srgb,var(--blue) 12%,transparent); }
  .news-backing span { display:-webkit-box; overflow:hidden; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .empty, .loading { text-align: center; padding: 60px; color: var(--muted); grid-column: 1 / -1; }
</style>
  <script src="theme.js?v=8"></script>
  <link rel="stylesheet" href="theme.css?v=8">
  <script src="i18n.js?v=9"></script>

</head>
<body>

<header>
  <div>
    <h1><span data-i18n="page.unusualTrading">Unusual Trading</span> <span style="color:var(--muted);font-weight:400;font-size:13px">— IS1 Team</span></h1>
    <div class="meta" id="meta" data-i18n="common.loading">Loading…</div>
  </div>
  <nav class="nav">
    <a href="index.html" data-i18n="nav.index">Index</a>
    <a href="price-movement.html" data-i18n="page.priceMovement">Price Movement</a>
    <a href="disclosure-pulse.html" data-i18n="nav.disclosures">Disclosures</a>
    <a href="oppday-minutes.html" data-i18n="nav.oppday">Oppday</a>
    <a href="multiples-comparison.html" data-i18n="page.multiplesComparison">Multiples Comparison</a>
    <a href="company-summary.html" data-i18n="page.companySummary">Company Summary</a>
    <a href="multiples-band.html" data-i18n="page.multiplesBand">Multiples Band</a>
    <a href="unusual-trading.html" class="active" data-i18n="nav.alerts">Alerts</a>
    <a href="external-news.html" data-i18n="nav.external">External</a>
    <a href="trading-signs.html" data-i18n="nav.signs">Signs</a>
    <a href="sec-enforcement.html" data-i18n="nav.sec">SEC</a>
    <span class="stale" id="staleBadge">●</span>
  </nav>
</header>

<div class="stats" id="statsBar"></div>

<div class="tab-bar">
  <div class="tab-row">
    <span class="tab-label"><span data-i18n="unusual.newsBacking">News backing</span>:</span>
    <div id="explainTabs" class="explain-row"></div>
  </div>
  <div class="tab-row">
    <span class="tab-label"><span data-i18n="common.rm">RM</span>:</span>
    <div id="rmTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
  <div class="tab-row">
    <span class="tab-label"><span data-i18n="common.severity">Severity</span>:</span>
    <div id="sevTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
    <span class="tab-label" style="margin-left:20px"><span data-i18n="common.type">Type</span>:</span>
    <div id="typeTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
    <span class="tab-label" style="margin-left:20px"><span data-i18n="common.sector">Sector</span>:</span>
    <div id="sectorTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
</div>

<div id="grid" class="grid"><div class="loading" data-i18n="common.fetchingAlerts">Fetching alerts…</div></div>

<script>
let TICKERS = {}, ALERTS = [];
let activeRm = /^[CKOGPT]$/.test(localStorage.getItem('is1_rm') || '') ? localStorage.getItem('is1_rm') : 'ALL', activeSev = 'ALL', activeType = 'ALL', activeSector = 'ALL', activeExplain = 'ALL';
let activeTicker = new URLSearchParams(location.search).get('ticker') || null;
let DATA_META = null;

const TT_FALLBACK = {
  "common.all": "All",
  "common.dotUpdatedAgo": "● updated {x} ago",
  "unusual.volume": "Volume",
  "unusual.avgVol20d": "20D avg vol",
  "unusual.std20d": "20D std",
  "unusual.close": "Close",
  "unusual.avg20d": "20D avg",
  "unusual.movePct": "Move %",
  "unusual.high52w": "52W high",
  "unusual.low52w": "52W low",
  "unusual.from52w": "% from 52W",
  "common.high": "High",
  "common.medium": "Medium",
  "common.low": "Low",
  "unusual.filteredTicker": "Filtered by ticker:",
  "unusual.totalAlerts": "Total alerts",
  "unusual.tickersFlagged": "Tickers flagged",
  "common.noAlerts": "No alerts matching filters.",
  "unusual.filingsLinked": "{n} filing(s) linked",
  "common.errorWithMsg": "Error: {msg}",
  "unusual.meta": "{n} alerts · as of {asOf} · {source}",
  "unusual.newsBacking": "News backing",
  "unusual.unexplained": "No news behind it",
  "unusual.explained": "Has news",
  "unusual.noNewsTitle": "No news behind this move",
  "unusual.noNewsHint": "No SET filing or external news on the price day or the day before",
};
function tt(key) { return window.I18N ? I18N.t(key) : (TT_FALLBACK[key] || key); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tx(key, vars) { return tt(key).replace(/\{(\w+)\}/g, (_, k) => vars && vars[k] != null ? vars[k] : ''); }
function allLabel() { return tt('common.all'); }

function freshnessLabel(builtAt) {
  if (!builtAt) return { txt: '?', warn: true };
  const ageH = (Date.now() - new Date(builtAt).getTime()) / 36e5;
  const x = ageH < 1 ? Math.round(ageH * 60) + 'm' : Math.round(ageH) + 'h';
  return { txt: tx('common.dotUpdatedAgo', { x }), warn: ageH > 36 };
}

function fmtNum(v) {
  if (v == null) return '—';
  if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toFixed(2);
}

function evidenceRows(ev) {
  if (!ev) return '';
  const map = { vol:tt('unusual.volume'), vol20dAvg:tt('unusual.avgVol20d'), vol20dStd:tt('unusual.std20d'),
    close:tt('unusual.close'), close20dAvg:tt('unusual.avg20d'), pctMove:tt('unusual.movePct'),
    high52w:tt('unusual.high52w'), low52w:tt('unusual.low52w'), pctFrom52:tt('unusual.from52w') };
  return Object.entries(ev).map(([k, v]) => {
    const lbl = map[k] || k;
    const fmt = typeof v === 'number' ? fmtNum(v) : String(v);
    return `<div class="ev-row"><span>${esc(lbl)}</span><span>${esc(fmt)}</span></div>`;
  }).join('');
}

function buildTabs() {
  const rmCounts = { ALL: ALERTS.length };
  ALERTS.forEach(a => { const r = (TICKERS[a.tk] || {}).rm || '?'; rmCounts[r] = (rmCounts[r] || 0) + 1; });
  const rms = Object.keys(rmCounts).filter(r => r !== 'ALL').sort((a, b) => rmCounts[b] - rmCounts[a]);
  document.getElementById('rmTabs').innerHTML = `
    <div class="tab ${activeRm === 'ALL' ? 'active' : ''}" data-rm="ALL" onclick="setRm('ALL')">${allLabel()} <span class="tab-count">${rmCounts.ALL}</span></div>
    ${rms.map(r => `<div class="tab" data-rm="${r}" onclick="setRm('${r}')">${r} <span class="tab-count">${rmCounts[r]}</span></div>`).join('')}`;

  document.getElementById('sevTabs').innerHTML = ['ALL','high','medium','low'].map(s => {
    const cls = s === activeSev ? 'tab active' : 'tab';
    const color = s === 'high' ? 'color:var(--red)' : s === 'medium' ? 'color:var(--yellow)' : s === 'low' ? 'color:var(--green)' : '';
    const lbl = { ALL: allLabel(), high: tt('common.high'), medium: tt('common.medium'), low: tt('common.low') }[s] || s;
    return `<div class="${cls}" style="${color}" data-sev="${s}" onclick="setSev('${s}')">${lbl}</div>`;
  }).join('');

  const types = [...new Set(ALERTS.map(a => a.atype || a.type).filter(Boolean))].sort();
  document.getElementById('typeTabs').innerHTML = `
    <div class="tab ${activeType === 'ALL' ? 'active' : ''}" data-type="ALL" onclick="setType('ALL')">${allLabel()}</div>
    ${types.map(t => `<div class="tab" data-type="${t}" onclick="setType('${t}')">${t.replace(/_/g, ' ')}</div>`).join('')}`;

  // Sector — dynamic from alerts, all 6 buckets
  const order = ['AGRI','FOOD','CONS','CONMAT','PROP','PFREIT','PF&REIT'];
  const secCounts = {};
  ALERTS.forEach(a => { secCounts[a.sector] = (secCounts[a.sector] || 0) + 1; });
  const sectorList = ['ALL', ...Object.keys(secCounts).sort((a,b) => order.indexOf(a) - order.indexOf(b))];
  document.getElementById('sectorTabs').innerHTML = sectorList.map(s => {
    const cls = s === activeSector ? 'tab active' : 'tab';
    const cnt = s === 'ALL' ? ALERTS.length : (secCounts[s] || 0);
    return `<div class="${cls}" data-sector="${s}" onclick="setSector('${s}')">${s === 'ALL' ? allLabel() : s} <span class="tab-count">${cnt}</span></div>`;
  }).join('');
}

function setRm(r) { activeRm = r; document.querySelectorAll('[data-rm]').forEach(el => el.classList.toggle('active', el.dataset.rm === r)); buildExplainTabs(); render(); updateStats(); }
window.addEventListener('is1:rm-change', e => {
  if (/^(ALL|[CKOGPT])$/.test(e.detail?.rm || '')) setRm(e.detail.rm);
});
function setSev(s) { activeSev = s; document.querySelectorAll('[data-sev]').forEach(el => el.classList.toggle('active', el.dataset.sev === s)); render(); }
function setType(t) { activeType = t; document.querySelectorAll('[data-type]').forEach(el => el.classList.toggle('active', el.dataset.type === t)); render(); }
function setSector(s) { activeSector = s; document.querySelectorAll('[data-sector]').forEach(el => el.classList.toggle('active', el.dataset.sector === s)); render(); }

function isThai() { return !!(window.I18N && I18N.lang === 'th'); }
// Match each alert to SET filings and external news dated on the price day or
// the day before (Bangkok dates), so an after-close filing on T-1 still counts.
function attachNews(pulse, news) {
  const asOf = (DATA_META && DATA_META.asOf) || '';
  if (!asOf) return;
  const prev = new Date(Date.parse(asOf + 'T00:00:00+07:00') - 864e5);
  const prevDay = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(prev);
  const bkkDay = ts => { const t = Date.parse(ts); return Number.isFinite(t) ? new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date(t)) : ''; };
  const inWindow = ts => { const d = bkkDay(ts); return d === asOf || d === prevDay; };
  const byTk = {};
  ((pulse && pulse.filings) || []).forEach(f => {
    if (!f.tk || !inWindow(f.ts)) return;
    (byTk[f.tk] = byTk[f.tk] || []).push({ kind: 'set', ts: f.ts, title: isThai() ? (f.title_th || f.title) : (f.title || f.title_th), url: isThai() ? (f.url_th || f.url) : (f.url || f.url_th) });
  });
  ((news && news.items) || []).forEach(n => {
    if (!n.tk || !inWindow(n.ts)) return;
    (byTk[n.tk] = byTk[n.tk] || []).push({ kind: 'ext', ts: n.ts, title: n.title, url: n.url, source: n.source });
  });
  ALERTS.forEach(a => {
    a._news = (byTk[a.tk] || []).slice().sort((x, y) => String(y.ts || '').localeCompare(String(x.ts || '')));
  });
}
function hasNews(a) { return a._news ? a._news.length > 0 : a.filingsLinked > 0; }
function setExplain(v) { activeExplain = v; buildExplainTabs(); render(); }
function buildExplainTabs() {
  const pool = ALERTS.filter(a => activeRm === 'ALL' || (TICKERS[a.tk] || {}).rm === activeRm);
  const none = pool.filter(a => !hasNews(a)).length;
  const chips = [['ALL', allLabel(), pool.length], ['none', tt('unusual.unexplained'), none], ['news', tt('unusual.explained'), pool.length - none]];
  document.getElementById('explainTabs').innerHTML = chips.map(([k, lbl, n]) =>
    `<button type="button" class="explain-chip ${k === 'none' ? 'none' : ''}${k === activeExplain ? ' active' : ''}" onclick="setExplain('${k}')">${esc(lbl)} <b>${n}</b></button>`).join('');
}
function safeUrl(u) { try { const x = new URL(String(u || ''), location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } }

function filtered() {
  return ALERTS.filter(a => {
    if (activeExplain === 'none' && hasNews(a)) return false;
    if (activeExplain === 'news' && !hasNews(a)) return false;
    const t = TICKERS[a.tk] || {};
    if (activeRm !== 'ALL' && t.rm !== activeRm) return false;
    if (activeSev !== 'ALL' && (a.severity || '').toLowerCase() !== activeSev) return false;
    if (activeType !== 'ALL' && (a.atype || a.type) !== activeType) return false;
    if (activeSector !== 'ALL' && a.sector !== activeSector) return false;
    if (activeTicker && a.tk !== activeTicker) return false;
    return true;
  });
}

function renderTickerBanner() {
  let el = document.getElementById('tickerBanner');
  if (!activeTicker) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'tickerBanner';
    el.style.cssText = 'margin:10px 20px;padding:8px 14px;background:#6366f118;border:1px solid #6366f133;border-radius:8px;font-size:12px;display:flex;align-items:center;justify-content:space-between;';
    document.getElementById('grid').before(el);
  }
  el.innerHTML = `<span>${esc(tt('unusual.filteredTicker'))} <strong style="color:#a5b4fc">${esc(activeTicker)}</strong></span><button onclick="clearTickerFilter()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px">×</button>`;
}

function clearTickerFilter() {
  activeTicker = null;
  history.replaceState(null, '', location.pathname);
  renderTickerBanner();
  render(); updateStats();
}

function updateStats() {
  const rows = ALERTS.filter(a => activeRm === 'ALL' || (TICKERS[a.tk] || {}).rm === activeRm);
  const counts = { high: 0, medium: 0, low: 0 };
  const byTk = new Set(rows.map(a => a.tk));
  rows.forEach(a => { const k = (a.severity || 'low').toLowerCase(); if (counts[k] !== undefined) counts[k]++; });
  document.getElementById('statsBar').innerHTML = `
    <div class="stat" style="color:var(--red)"><div class="stat-val">${counts.high}</div><div class="stat-lbl">${tt('common.high')}</div></div>
    <div class="stat" style="color:var(--yellow)"><div class="stat-val">${counts.medium}</div><div class="stat-lbl">${tt('common.medium')}</div></div>
    <div class="stat" style="color:var(--green)"><div class="stat-val">${counts.low}</div><div class="stat-lbl">${tt('common.low')}</div></div>
    <div class="stat" style="color:var(--red)"><div class="stat-val">${rows.filter(a => !hasNews(a)).length}</div><div class="stat-lbl">${tt('unusual.unexplained')}</div></div>
    <div class="stat"><div class="stat-val">${rows.length}</div><div class="stat-lbl">${tt('unusual.totalAlerts')}</div></div>
    <div class="stat"><div class="stat-val">${byTk.size}</div><div class="stat-lbl">${tt('unusual.tickersFlagged')}</div></div>`;
}

function render() {
  renderTickerBanner();
  const sevRank = { high: 0, medium: 1, low: 2 };
  const rows = filtered().slice().sort((a, b) =>
    (hasNews(a) - hasNews(b)) || ((sevRank[(a.severity || 'low').toLowerCase()] ?? 3) - (sevRank[(b.severity || 'low').toLowerCase()] ?? 3)));
  const grid = document.getElementById('grid');
  if (!rows.length) { grid.innerHTML = `<div class="empty">${tt('common.noAlerts')}</div>`; return; }
  grid.innerHTML = rows.map(a => {
    const sev = (a.severity || 'low').toLowerCase();
    const t = TICKERS[a.tk] || {};
    const alertType = a.type || a.atype || '—';
    const rm = esc(t.rm || '');
    const sector = esc(a.sector || '');
    const safeSev = esc(sev);
    const backed = hasNews(a);
    const newsHtml = !backed
      ? `<div class="no-news">● ${esc(tt('unusual.noNewsTitle'))}<small>${esc(tt('unusual.noNewsHint'))}</small></div>`
      : a._news
        ? `<div class="news-backing">${a._news.slice(0, 2).map(n => {
            const u = safeUrl(n.url);
            const inner = `<em class="${n.kind}">${n.kind === 'set' ? 'SET' : esc(n.source || 'NEWS')}</em><span>${esc(n.title || '')}</span>`;
            return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${inner}</a>` : `<a>${inner}</a>`;
          }).join('')}</div>`
        : `<div class="filings-linked">⚡ ${tx('unusual.filingsLinked', { n: a.filingsLinked })}</div>`;
    return `<div class="alert-card ${safeSev}${backed ? '' : ' unexplained'}">
      <div class="alert-top">
        <div>
          <div class="alert-tk-row">
            <span class="alert-tk">${esc(a.tk || '')}</span>
            ${rm ? `<span class="rm-badge">${rm}</span>` : ''}
          </div>
          <span class="sector-badge s-${sector}">${sector}</span>
        </div>
        <span class="sev-badge sev-${safeSev}">${safeSev}</span>
      </div>
      <div class="alert-type">${esc(alertType)}</div>
      <div class="alert-label">${esc(a.label || '')}</div>
      ${a.evidence ? `<div class="alert-evidence">${evidenceRows(a.evidence)}</div>` : ''}
      ${newsHtml}
    </div>`;
  }).join('');
}

async function init() {
  try {
    const soft = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
    const [tj, dj, pj, nj] = await Promise.all([
      fetch('./data/tickers.json').then(r => r.json()),
      fetch('./data/unusual-trading.json').then(r => r.json()),
      soft('./data/disclosure-pulse.json'),
      soft('./data/external-news.json'),
    ]);
    tj.tickers.forEach(t => { TICKERS[t.tk] = t; });
    ALERTS = dj.alerts || [];
    DATA_META = dj;
    if (pj || nj) attachNews(pj, nj);
    const fresh = freshnessLabel(dj._built_at);
    const badge = document.getElementById('staleBadge');
    badge.textContent = fresh.txt;
    if (fresh.warn) badge.classList.add('warn');
    updateMeta();
    buildTabs(); buildExplainTabs(); updateStats(); render();
  } catch(e) {
    document.getElementById('grid').innerHTML = `<div class="empty">${tx('common.errorWithMsg', { msg: e.message })}</div>`;
  }
}
init();
function updateMeta() {
  if (!DATA_META) return;
  document.getElementById('meta').textContent = tx('unusual.meta', {
    n: ALERTS.length,
    asOf: DATA_META.asOf || '',
    source: DATA_META.source || ''
  });
}
window.addEventListener('i18n:change', () => {
  if (window.I18N) I18N.apply();
  updateMeta();
  buildTabs();
  buildExplainTabs();
  updateStats();
  render();
});
</script>
