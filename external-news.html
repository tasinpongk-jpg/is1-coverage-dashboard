<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>External News — IS1 Team</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e2e8f0;
    --muted: #7c8298; --accent: #6366f1;
    --food: #3b82f6; --prop: #8b5cf6; --pfreit: #06b6d4; --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { font-size: 16px; font-weight: 600; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .nav { display: flex; gap: 14px; align-items: center; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  .nav a:hover { color: var(--text); background: var(--border); }
  .nav a.active { color: var(--text); background: #6366f122; border: 1px solid #6366f155; }
  .stale { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #22c55e22; color: var(--green); border: 1px solid #22c55e33; }
  .stale.warn { background: #f59e0b22; color: var(--yellow); border-color: #f59e0b33; }

  .tab-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tab-row { display: flex; gap: 4px; padding: 8px 0; align-items: center; flex-wrap: wrap; }
  .tab-row + .tab-row { border-top: 1px dashed var(--border); }
  .tab-label { font-size: 11px; color: var(--muted); margin-right: 8px; min-width: 60px; }
  .tab { padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted); border: 1px solid transparent; user-select: none; }
  .tab:hover { color: var(--text); background: #2a2d3a; }
  .tab.active { background: #6366f122; border-color: #6366f155; color: var(--text); font-weight: 600; }
  .tab-count { color: var(--muted); margin-left: 4px; font-size: 10px; }

  .stats { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .stat { flex: 1; text-align: center; padding: 10px; border-right: 1px solid var(--border); }
  .stat:last-child { border-right: none; }
  .stat-val { font-size: 18px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: var(--muted); }

  .feed { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; border-left: 3px solid var(--accent); }
  .item-top { display: flex; align-items: flex-start; gap: 10px; }
  .item-tk { font-weight: 700; font-size: 14px; min-width: 70px; }
  .item-content { flex: 1; }
  .item-title { font-size: 13px; line-height: 1.4; }
  .item-title a { color: var(--text); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-meta { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
  .src-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; text-transform: uppercase; background: #6366f122; color: #a5b4fc; }
  .rm-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; background: #6366f122; color: #a5b4fc; }
  .sector-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .s-FOOD, .s-AGRI { background: #3b82f622; color: var(--food); }
  .s-PROP, .s-CONS, .s-CONMAT { background: #8b5cf622; color: var(--prop); }
  .s-PFREIT { background: #06b6d422; color: var(--pfreit); }
  .ts { font-size: 11px; color: var(--muted); }
  .excerpt { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.4; }
  .empty, .loading { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <h1>External News <span style="color:var(--muted);font-weight:400;font-size:13px">— Wire / RSS coverage matches</span></h1>
    <div class="meta" id="meta">Loading...</div>
  </div>
  <nav class="nav">
    <a href="index.html">Index</a>
    <a href="coverage-morning-brief.html">Brief</a>
    <a href="disclosure-pulse.html">Disclosures</a>
    <a href="sector-heatmap.html">Heatmap</a>
    <a href="ticker-summary.html">Tickers</a>
    <a href="sector-comparison.html">Compare</a>
    <a href="unusual-trading.html">Alerts</a>
    <a href="external-news.html" class="active">External</a>
    <a href="trading-signs.html">Signs</a>
    <a href="sec-enforcement.html">SEC</a>
    <a href="macro-overlays.html">Macro</a>
    <span class="stale" id="staleBadge">..</span>
  </nav>
</header>

<div class="stats" id="statsBar"></div>

<div class="tab-bar">
  <div class="tab-row">
    <span class="tab-label">Window:</span>
    <div id="windowTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
  <div class="tab-row">
    <span class="tab-label">Source:</span>
    <div id="srcTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
    <span class="tab-label" style="margin-left:20px">Sector:</span>
    <div id="sectorTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
  <div class="tab-row">
    <span class="tab-label">RM:</span>
    <div id="rmTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
</div>

<div id="feed" class="feed"><div class="loading">Fetching wire hits...</div></div>

<script>
let TICKERS = {}, ITEMS = [];
let activeWindow = 7, activeSrc = 'ALL', activeSector = 'ALL', activeRm = 'ALL';
const WINDOWS = [
  { key: 1, label: '1d' }, { key: 3, label: '3d' }, { key: 7, label: '7d' },
  { key: 14, label: '14d' }, { key: 30, label: '30d' }, { key: 0, label: 'All' },
];

function freshnessLabel(builtAt) {
  if (!builtAt) return { txt: '?', warn: true };
  const ageH = (Date.now() - new Date(builtAt).getTime()) / 36e5;
  return { txt: 'updated ' + (ageH < 1 ? Math.round(ageH * 60) + 'm' : Math.round(ageH) + 'h') + ' ago', warn: ageH > 36 };
}
function formatTs(ts) { if (!ts) return ''; try { return new Date(ts).toLocaleString('th-TH', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); } catch { return ts; } }
function inWindow(it) {
  if (activeWindow === 0) return true;
  if (!it.ts) return false;
  const t = new Date(it.ts).getTime();
  if (Number.isNaN(t)) return false;
  return (Date.now() - t) <= activeWindow * 86400 * 1000;
}
function filtered() {
  return ITEMS.filter(it => {
    if (!inWindow(it)) return false;
    if (activeSrc !== 'ALL' && it.source !== activeSrc) return false;
    if (activeSector !== 'ALL' && it.sector !== activeSector) return false;
    if (activeRm !== 'ALL' && it.rm !== activeRm) return false;
    return true;
  });
}
function buildWindowTabs() {
  document.getElementById('windowTabs').innerHTML = WINDOWS.map(w => `<div class="tab ${w.key === activeWindow ? 'active' : ''}" onclick="setWindow(${w.key})">${w.label}</div>`).join('');
}
function buildSrcTabs() {
  const inWin = ITEMS.filter(inWindow);
  const counts = {};
  inWin.forEach(it => { counts[it.source] = (counts[it.source] || 0) + 1; });
  const sources = ['ALL', ...Object.keys(counts).sort((a,b)=>counts[b]-counts[a])];
  document.getElementById('srcTabs').innerHTML = sources.map(s => {
    const cnt = s === 'ALL' ? inWin.length : counts[s];
    return `<div class="tab ${s === activeSrc ? 'active' : ''}" onclick="setSrc('${s}')">${s === 'ALL' ? 'All' : s} <span class="tab-count">${cnt}</span></div>`;
  }).join('');
}
function buildSectorTabs() {
  const order = ['AGRI','FOOD','CONS','CONMAT','PROP','PFREIT'];
  const inScope = ITEMS.filter(it => inWindow(it) && (activeSrc==='ALL'||it.source===activeSrc));
  const counts = {};
  inScope.forEach(it => { if (it.sector) counts[it.sector] = (counts[it.sector] || 0) + 1; });
  const sectors = ['ALL', ...Object.keys(counts).sort((a,b) => order.indexOf(a) - order.indexOf(b))];
  document.getElementById('sectorTabs').innerHTML = sectors.map(s => {
    const cnt = s === 'ALL' ? inScope.length : counts[s];
    return `<div class="tab ${s === activeSector ? 'active' : ''}" onclick="setSector('${s}')">${s === 'ALL' ? 'All' : s} <span class="tab-count">${cnt}</span></div>`;
  }).join('');
}
function buildRmTabs() {
  const inScope = ITEMS.filter(it => inWindow(it) && (activeSrc==='ALL'||it.source===activeSrc) && (activeSector==='ALL'||it.sector===activeSector));
  const counts = {};
  inScope.forEach(it => { const r = it.rm || '?'; counts[r] = (counts[r]||0)+1; });
  const rms = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  document.getElementById('rmTabs').innerHTML = `<div class="tab ${activeRm==='ALL'?'active':''}" onclick="setRm('ALL')">All <span class="tab-count">${inScope.length}</span></div>` +
    rms.map(r => `<div class="tab ${activeRm===r?'active':''}" onclick="setRm('${r}')">${r} <span class="tab-count">${counts[r]}</span></div>`).join('');
}
function setWindow(d) { activeWindow=+d; buildAll(); }
function setSrc(s) { activeSrc=s; buildAll(); }
function setSector(s) { activeSector=s; buildAll(); }
function setRm(r) { activeRm=r; buildAll(); }
function buildAll() { buildWindowTabs(); buildSrcTabs(); buildSectorTabs(); buildRmTabs(); updateStats(); render(); }
function updateStats() {
  const rows = filtered();
  const winLabel = (WINDOWS.find(w=>w.key===activeWindow)||{}).label || '?';
  const bySrc = {};
  rows.forEach(it => { bySrc[it.source] = (bySrc[it.source]||0)+1; });
  const topSrc = Object.keys(bySrc).sort((a,b)=>bySrc[b]-bySrc[a])[0] || '-';
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-val">${rows.length}</div><div class="stat-lbl">Items - ${winLabel}</div></div>
    <div class="stat"><div class="stat-val">${new Set(rows.map(r=>r.tk)).size}</div><div class="stat-lbl">Tickers hit</div></div>
    <div class="stat"><div class="stat-val">${Object.keys(bySrc).length}</div><div class="stat-lbl">Sources</div></div>
    <div class="stat"><div class="stat-val" style="font-size:13px;font-weight:600">${topSrc}</div><div class="stat-lbl">Top source</div></div>`;
}
function render() {
  const rows = filtered();
  const feed = document.getElementById('feed');
  if (!rows.length) { feed.innerHTML = '<div class="empty">No external news matches the filters.</div>'; return; }
  feed.innerHTML = rows.map(it => `<div class="item">
    <div class="item-top">
      <div class="item-tk">${it.tk}</div>
      <div class="item-content">
        <div class="item-title">${it.url ? `<a href="${it.url}" target="_blank" rel="noopener">${it.title || ''}</a>` : (it.title || '')}</div>
        <div class="item-meta">
          <span class="src-badge">${it.source}</span>
          ${it.rm ? `<span class="rm-badge">${it.rm}</span>` : ''}
          ${it.sector ? `<span class="sector-badge s-${it.sector}">${it.sector}</span>` : ''}
          ${it.lang ? `<span style="font-size:10px;color:var(--muted)">${it.lang}</span>` : ''}
          <span class="ts">${formatTs(it.ts)}</span>
        </div>
        ${it.excerpt ? `<div class="excerpt">${it.excerpt}</div>` : ''}
      </div>
    </div>
  </div>`).join('');
}
async function init() {
  try {
    const [tj, dj] = await Promise.all([
      fetch('./data/tickers.json').then(r=>r.json()),
      fetch('./data/external-news.json').then(r=>r.json()),
    ]);
    tj.tickers.forEach(t => { TICKERS[t.tk] = t; });
    ITEMS = dj.items || [];
    const fresh = freshnessLabel(dj._built_at);
    const badge = document.getElementById('staleBadge');
    badge.textContent = fresh.txt;
    if (fresh.warn) badge.classList.add('warn');
    document.getElementById('meta').textContent = `${ITEMS.length} wire/RSS hits - ${(dj.sources||[]).join(', ')} - as of ${dj.asOf || ''}`;
    buildAll();
  } catch(e) {
    document.getElementById('feed').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}
init();
</script>
</body>
</html>
