<head>
<meta charset="UTF-8">

<title>Multiples Band — IS1 Coverage Desk</title>
<style>
:root{
  --bg:#0a0c12;--bg2:#0f1117;--card:#14171f;--card2:#1a1d27;
  --border:#232733;--border2:#2a2f3d;
  --text:#e6e8ed;--muted:#8089a0;--dim:#5a627a;
  --accent:#6366f1;--glow:#6366f130;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
  --food:#3b82f6;--agri:#10b981;--prop:#8b5cf6;
  --cons:#f97316;--conmat:#ec4899;--pfreit:#06b6d4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,#1a1d3022 0%,transparent 55%);pointer-events:none;z-index:0}

header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:#0a0c12ee;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;color:#fff}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.2px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
nav.nav{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
nav.nav a{color:var(--muted);text-decoration:none;font-size:12px;padding:5px 8px;border-radius:5px;transition:color .12s,background .12s;white-space:nowrap}
nav.nav a:hover{color:var(--text);background:var(--border)}
nav.nav a.active{color:var(--text);background:#6366f118;border:1px solid #6366f133}
.stale{font-size:11px;padding:4px 10px;border-radius:20px;background:#22c55e15;color:var(--green);border:1px solid #22c55e30;white-space:nowrap}
.stale.warn{background:#f59e0b15;color:var(--yellow);border-color:#f59e0b30}
.stale.unknown{background:#5a627a15;color:var(--muted);border-color:#5a627a30}

main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:24px 24px 48px;position:relative;z-index:1}
.pg-title{font-size:20px;font-weight:800;letter-spacing:-.4px}
.pg-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* metric section */
.metric-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-top:18px}
.metric-title{font-size:14px;font-weight:700;margin-bottom:4px}
.metric-desc{font-size:11px;color:var(--muted);margin-bottom:18px}

/* box plot chart */
.chart-wrap{overflow-x:auto;margin-bottom:18px}
.chart-wrap svg{display:block;min-width:460px}

.band-legend{margin-top:6px;color:var(--muted);font-size:10px}
.band-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:12px}
.band-pick label{color:var(--muted);font-weight:600}
.band-pick select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font:inherit}
#pickNote{color:var(--muted);font-size:11px}

/* summary table */
.sum-table{width:100%;border-collapse:collapse;font-size:11px}
.sum-table th{text-align:right;padding:5px 8px;color:var(--muted);font-size:10px;font-weight:600;border-bottom:1px solid var(--border)}
.sum-table th:first-child{text-align:left}
.sum-table td{text-align:right;padding:5px 8px;border-bottom:1px dashed #1e2233;font-variant-numeric:tabular-nums}
.sum-table td:first-child{text-align:left}
.sum-table tr:last-child td{border-bottom:none}
.sum-table .sect-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* loading */
#loading{text-align:center;padding:70px 20px;color:var(--muted)}
.spinner{width:26px;height:26px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

footer{padding:14px 24px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
footer a{color:var(--muted);text-decoration:none}

@media(max-width:600px){main{padding:12px 12px 40px}header{padding:10px 12px}nav.nav a{font-size:10px;padding:4px 5px}}
</style>
  <script src="theme.js?v=8"></script>

<body>

    <div><div class="brand-name" data-i18n="brand.coverageDesk">Coverage Desk</div><div class="brand-sub" data-i18n="brand.setIssuerDept1">SET Issuer Dept 1</div></div>

    <a href="multiples-comparison.html" data-i18n="page.multiplesComparison">Multiples Comparison</a>
    <a href="company-summary.html" data-i18n="page.companySummary">Company Summary</a>
    <a href="multiples-band.html" class="active" data-i18n="page.multiplesBand">Multiples Band</a>

<main>
  <div><div class="pg-title" data-i18n="page.multiplesBand">Multiples Band</div><div class="pg-sub" id="pgSub" data-i18n="common.loading">Loading…</div></div>
  <div id="loading"><div class="spinner"></div><span data-i18n="common.buildingSectorStats">Building sector statistics…</span></div>
  <div class="band-pick" id="bandPick" hidden>
    <label for="pickSel" data-i18n="band.highlight">Highlight a ticker</label>
    <select id="pickSel"></select>
    <span id="pickNote"></span>
  </div>
  <div id="sections"></div>
</main>

<footer>
  <span id="fsrc">IS1 Coverage Desk · Multiples Band</span>
  <span><span data-i18n="common.data">Data</span>: <a href="https://www.set.or.th" target="_blank" rel="noopener">SET.or.th</a> · SETSMART</span>
</footer>

<script>
const TT_FALLBACK = {
  "band.noMetricData": "No data for this metric.",
  "band.legend": "▌ = IQR (25–75th pctile)  │ = median  ● = individual tickers  ─ = 10–90th pctile",
  "common.sector": "Sector",
  "common.median": "Median",
  "common.mean": "Mean",
  "band.lowerAttractive": " Lower is more attractive for buyers.",
  "band.higherAttractive": " Higher is more attractive.",
  "common.failedToLoadMsg": "Failed to load: {msg}",
  "band.runBuild": "Run build_ticker_summary.py to generate data.",
  "multiples.meta": "{n} tickers · as of {asOf} · {source}",
  "band.footerSource": "IS1 Multiples Band · {asOf}",
  "band.highlight": "Highlight a ticker",
  "band.none": "None",
  "band.pickNote": "{tk} is ringed on every chart where {sector} has data; hover any dot to see its ticker.",
};
function tt(key) { return window.I18N ? I18N.t(key) : (TT_FALLBACK[key] || key); }
function tx(key, vars){return tt(key).replace(/\{(\w+)\}/g,(_,k)=>vars&&vars[k]!=null?vars[k]:'')}
function esc(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const SCOL={FOOD:'#3b82f6',AGRI:'#10b981',PROP:'#8b5cf6',CONS:'#f97316',CONMAT:'#ec4899',PFREIT:'#06b6d4'};
const SECT_ORDER=['FOOD','AGRI','PROP','CONS','CONMAT','PFREIT'];
const ns=s=>s==='PF&REIT'?'PFREIT':(s||'');
let PICKED=null;
let LAST_STATS=null, LAST_ASOF=null, LAST_SOURCE='', LAST_TICKERS=[], ALL_TICKERS=[];
let ACTIVE_RM=/^[CKOGPT]$/.test(localStorage.getItem('is1_rm') || '') ? localStorage.getItem('is1_rm') : 'C';

const METRICS=[
  {key:'pe',  labelKey:'band.peLabel',  descKey:'band.peDesc',  unit:'×', lowerBetter:true,  fmt:v=>v==null?null:v.toFixed(1)+'×'},
  {key:'pbv', labelKey:'band.pbvLabel', descKey:'band.pbvDesc', unit:'×', lowerBetter:true,  fmt:v=>v==null?null:v.toFixed(2)+'×'},
  {key:'dy',  labelKey:'band.dyLabel',  descKey:'band.dyDesc',  unit:'%', lowerBetter:false, fmt:v=>v==null?null:v.toFixed(2)+'%'},
  {key:'npm', labelKey:'band.npmLabel', descKey:'band.npmDesc', unit:'%', lowerBetter:false, fmt:v=>v==null?null:v.toFixed(1)+'%'},
];

// ── stats computation ────────────────────────────────────────────────────────
function percentile(sorted, p){ const i=Math.floor(sorted.length*p); return sorted[Math.min(i,sorted.length-1)]; }
function median(sorted){ const n=sorted.length; return n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[Math.floor(n/2)]; }
function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }

function computeStats(tickers){
  const bySector={};
  tickers.forEach(t=>{
    const s=ns(t.sector);
    if(!bySector[s]) bySector[s]=[];
    bySector[s].push(t);
  });

  const out={};
  SECT_ORDER.forEach(sector=>{
    const ts=bySector[sector]||[];
    out[sector]={n:ts.length,metrics:{}};
    METRICS.forEach(({key})=>{
      // For npm, pull from latest highlights year
      const pts=ts.map(t=>{
        let v=t[key];
        if(key==='npm'){
          const hl=t.highlights||[];
          const last=hl.filter(h=>(h.months||12)===12).slice(-1)[0]||hl.slice(-1)[0];
          v=last?last.npm:null;
        }
        return {tk:t.tk,v};
      }).filter(p=>p.v!=null&&p.v>0&&isFinite(p.v)).sort((a,b)=>a.v-b.v);
      const vals=pts.map(p=>p.v);
      if(!vals.length) return;
      out[sector].metrics[key]={
        vals, pts, n:vals.length,
        p10:percentile(vals,.10), p25:percentile(vals,.25),
        median:median(vals),
        p75:percentile(vals,.75), p90:percentile(vals,.90),
        mean:+mean(vals).toFixed(3),
        min:vals[0], max:vals[vals.length-1],
      };
    });
  });
  return out;
}

// ── box plot SVG ─────────────────────────────────────────────────────────────
// Axis step of 1, 2, 2.5 or 5 x 10^n so tick labels read as round numbers.
function niceStep(range, count){
  const raw=range/count, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  return [1,2,2.5,5,10].map(m=>m*mag).find(st=>st>=raw)||10*mag;
}
function boxPlot(stats, metricKey, fmt, lowerBetter){
  const W=680, LEFT=74, RIGHT=24, CHART=W-LEFT-RIGHT;
  const ROW=50, TOP=20, AXIS=22;
  const sectors=SECT_ORDER.filter(s=>stats[s]?.metrics[metricKey]);
  if(!sectors.length) return `<p style="color:var(--dim);font-size:12px;padding:8px 0">${tt('band.noMetricData')}</p>`;
  const plotBottom=TOP+sectors.length*ROW;
  const H=plotBottom+AXIS;

  // x range across all sectors, snapped outward to round ticks
  const allVals=sectors.flatMap(s=>stats[s].metrics[metricKey].vals);
  const lo=Math.min(...allVals), hi=Math.max(...allVals);
  const step=niceStep((hi-lo)||1,5);
  const xMin=Math.max(0,Math.floor(lo/step)*step), xMax=Math.ceil(hi/step)*step+(hi%step===0?step:0);
  const xRange=xMax-xMin||1;
  const px=v=>LEFT+((v-xMin)/xRange)*CHART;
  const ticks=[];
  for(let v=xMin; v<=xMax+step/1000; v+=step) ticks.push(+v.toFixed(6));
  const lbl=v=>fmt(v).replace('×','x');

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:'Inter','Segoe UI',system-ui,sans-serif">`;
  ticks.forEach(v=>{
    const x=px(v);
    svg+=`<line x1="${x}" y1="${TOP}" x2="${x}" y2="${plotBottom}" style="stroke:var(--line-soft,var(--border))" stroke-width="1"/>`;
    svg+=`<text x="${x}" y="${plotBottom+15}" text-anchor="middle" style="fill:var(--muted)" font-size="10">${lbl(v)}</text>`;
  });
  svg+=`<line x1="${LEFT}" y1="${plotBottom}" x2="${W-RIGHT}" y2="${plotBottom}" style="stroke:var(--border)" stroke-width="1"/>`;

  const pick=PICKED;
  sectors.forEach((sector,i)=>{
    const m=stats[sector].metrics[metricKey];
    const cy=TOP+i*ROW+ROW/2+4;
    const col=SCOL[sector]||'#6366f1';

    // Whiskers (p10–p90)
    svg+=`<line x1="${px(m.p10)}" y1="${cy}" x2="${px(m.p90)}" y2="${cy}" stroke="${col}" stroke-width="1.5" opacity="0.4"/>`;
    svg+=`<line x1="${px(m.p10)}" y1="${cy-5}" x2="${px(m.p10)}" y2="${cy+5}" stroke="${col}" stroke-width="1.5" opacity="0.4"/>`;
    svg+=`<line x1="${px(m.p90)}" y1="${cy-5}" x2="${px(m.p90)}" y2="${cy+5}" stroke="${col}" stroke-width="1.5" opacity="0.4"/>`;

    // IQR box
    const boxX=px(m.p25), boxW=Math.max(2,px(m.p75)-px(m.p25));
    svg+=`<rect x="${boxX}" y="${cy-9}" width="${boxW}" height="18" rx="3" fill="${col}" opacity="0.18"/>`;
    svg+=`<rect x="${boxX}" y="${cy-9}" width="${boxW}" height="18" rx="3" fill="none" stroke="${col}" stroke-width="1.2" opacity="0.6"/>`;

    // Individual tickers (jittered vertically, deterministic), each named on hover
    m.pts.forEach(({tk,v},j)=>{
      if(tk===pick) return;
      const jy=((v*31+j*17)%22)-11;
      svg+=`<circle cx="${px(v)}" cy="${cy+jy*0.45}" r="2.6" fill="${col}" opacity="0.35"><title>${esc(tk)} · ${lbl(v)}</title></circle>`;
    });

    // Median line
    const medX=px(m.median);
    svg+=`<line x1="${medX}" y1="${cy-11}" x2="${medX}" y2="${cy+11}" stroke="${col}" stroke-width="2.5"/>`;

    // Sector label
    svg+=`<text x="${LEFT-10}" y="${cy+4}" text-anchor="end" fill="${col}" font-size="11" font-weight="700">${sector}</text>`;

    // Median value label, above the row, haloed so it reads over dots and lines
    const lblAnchor=medX>LEFT+CHART*0.8?'end':'start';
    const lblX=lblAnchor==='end'?medX-5:medX+5;
    svg+=`<text x="${lblX}" y="${cy-15}" text-anchor="${lblAnchor}" fill="${col}" font-size="9.5" font-weight="700" paint-order="stroke" style="stroke:var(--card)" stroke-width="3" stroke-linejoin="round">${esc(tt('band.medAbbrev'))} ${lbl(m.median)}</text>`;

    // Picked ticker: ring + label, drawn last so it sits on top
    const hit=pick&&m.pts.find(p=>p.tk===pick);
    if(hit){
      const x=px(hit.v);
      const right=x>LEFT+CHART*0.8;
      svg+=`<circle cx="${x}" cy="${cy}" r="6" style="fill:var(--card)" stroke="${col}" stroke-width="2.5"/><circle cx="${x}" cy="${cy}" r="2.4" style="fill:var(--text)"/>`;
      svg+=`<text x="${right?x-9:x+9}" y="${cy+20}" text-anchor="${right?'end':'start'}" style="fill:var(--text);stroke:var(--card)" font-size="10.5" font-weight="800" paint-order="stroke" stroke-width="3" stroke-linejoin="round">${esc(pick)} ${lbl(hit.v)} · ${ordinal(pctRank(m.vals,hit.v))}</text>`;
    }
  });

  svg+='</svg>';
  return svg+`<div class="band-legend">${esc(tt('band.legend'))}</div>`;
}
function pctRank(sorted,v){ return Math.round(sorted.filter(x=>x<v).length/Math.max(1,sorted.length-1)*100); }
function ordinal(n){ if(window.I18N&&I18N.lang==='th') return 'เปอร์เซ็นไทล์ที่ '+n; const suf=(n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'); return n+suf+' pctile'; }

// ── summary table ────────────────────────────────────────────────────────────
function summaryTable(stats, metricKey, fmt, lowerBetter){
  const sectors=SECT_ORDER.filter(s=>stats[s]?.metrics[metricKey]);
  if(!sectors.length) return '';
  let html=`<div style="overflow-x:auto"><table class="sum-table">
    <thead><tr><th>${tt('common.sector')}</th><th>n</th><th>p25</th><th>${tt('common.median')}</th><th>p75</th><th>${tt('common.mean')}</th></tr></thead><tbody>`;
  sectors.forEach(s=>{
    const m=stats[s].metrics[metricKey];
    const col=SCOL[s]||'#6366f1';
    html+=`<tr>
      <td><span class="sect-dot" style="background:${col}"></span>${s}</td>
      <td style="color:var(--dim)">${m.n}</td>
      <td>${fmt(m.p25)}</td>
      <td style="font-weight:700;color:${col}">${fmt(m.median)}</td>
      <td>${fmt(m.p75)}</td>
      <td style="color:var(--muted)">${fmt(m.mean)}</td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  return html;
}

// ── render ────────────────────────────────────────────────────────────────────
function renderPicker(){
  const box=document.getElementById('bandPick'), sel=document.getElementById('pickSel');
  const tks=LAST_TICKERS.map(t=>t.tk).sort();
  if(PICKED&&!tks.includes(PICKED)) PICKED=null;
  sel.innerHTML=`<option value="">${esc(tt('band.none'))}</option>`+tks.map(tk=>`<option${tk===PICKED?' selected':''}>${esc(tk)}</option>`).join('');
  box.hidden=!tks.length;
  const t=LAST_TICKERS.find(x=>x.tk===PICKED);
  document.getElementById('pickNote').textContent=t?tx('band.pickNote',{tk:t.tk,sector:ns(t.sector)}):'';
}
document.getElementById('pickSel').addEventListener('change',e=>{
  PICKED=e.target.value||null;
  try{ PICKED?localStorage.setItem('is1_band_pick',PICKED):localStorage.removeItem('is1_band_pick'); }catch(_){}
  renderPicker();
  if(LAST_STATS) renderSections(LAST_STATS,LAST_ASOF);
});
try{ PICKED=new URLSearchParams(location.search).get('tk')||localStorage.getItem('is1_band_pick')||null; }catch(_){}

function renderSections(stats, asOf){
  renderPicker();
  const el=document.getElementById('sections');
  el.innerHTML=METRICS.map(({key,labelKey,descKey,fmt,lowerBetter})=>`
    <div class="metric-section">
      <div class="metric-title">${tt(labelKey)}</div>
      <div class="metric-desc">${tt(descKey)}${lowerBetter?tt('band.lowerAttractive'):tt('band.higherAttractive')}</div>
      <div class="chart-wrap">${boxPlot(stats,key,fmt,lowerBetter)}</div>
      ${summaryTable(stats,key,fmt,lowerBetter)}
    </div>`).join('');
}

function applyShellRm(rm){
  if(!/^[CKOGPT]$/.test(rm||''))return;
  ACTIVE_RM=rm;
  if(!ALL_TICKERS.length)return;
  LAST_TICKERS=ALL_TICKERS.filter(t=>t.rm===ACTIVE_RM);
  LAST_STATS=computeStats(LAST_TICKERS);
  renderSections(LAST_STATS,LAST_ASOF);
  updateMeta({asOf:LAST_ASOF,source:LAST_SOURCE});
}
window.addEventListener('is1:rm-change',e=>applyShellRm(e.detail?.rm));

// ── boot ─────────────────────────────────────────────────────────────────────
(async()=>{
  try{
    const r=await fetch('data/ticker-summary.json');
    if(!r.ok) throw new Error('ticker-summary.json not found');
    const d=await r.json();
    const tickers=d.tickers||[];
    ALL_TICKERS=tickers; LAST_ASOF=d.asOf; LAST_SOURCE=d.source||'';
    applyShellRm(ACTIVE_RM);
    document.getElementById('loading').style.display='none';
    updateMeta(d);
    const badge=document.getElementById('staleBadge');
    if(d._built_at){
      const h=(Date.now()-new Date(d._built_at).getTime())/3600000;
      badge.textContent=`● ${d.asOf||'—'}`;
      badge.className=h>24?'stale warn':'stale';
    }
  }catch(err){
    document.getElementById('loading').innerHTML=`<div style="color:var(--red)">${tx('common.failedToLoadMsg',{msg:err.message})}<br><small style="color:var(--dim)">${tt('band.runBuild')}</small></div>`;
  }
})();
function updateMeta(d){
  if(!d) return;
  document.getElementById('pgSub').textContent=tx('multiples.meta',{n:LAST_TICKERS.length,asOf:d.asOf||'—',source:d.source||''});
  document.getElementById('fsrc').textContent=tx('band.footerSource',{asOf:d.asOf||'—'});
}
window.addEventListener('i18n:change',()=>{
  if(window.I18N) I18N.apply();
  if(LAST_STATS) renderSections(LAST_STATS,LAST_ASOF);
  updateMeta({asOf:LAST_ASOF,source:LAST_SOURCE});
});
</script>
<script src="nav.js?v=13" defer></script>
<script src="chat-dock.js?v=8" defer></script>
