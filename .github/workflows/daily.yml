name: Daily Surveillance + Build

# Consolidated daily workflow:
#   Job 1 (surveillance): poll new SET disclosures, classify with rules-first
#                         + Haiku fallback, send email alerts, upload DuckDB
#                         to R2 for the build job.
#   Job 2 (build):        download DuckDB from R2, run 4 SETSMART routes,
#                         commit data/*.json. Cloudflare auto-deploys.
#
# Schedules (Mon-Fri):
#   02:50 UTC = 09:50 Bangkok — MORNING run (full pipeline + all 3 email modes)
#   10:30 UTC = 17:30 Bangkok — AFTERNOON catch-up (critical email only)
#
# The afternoon run skips digest + coverage-feed to avoid duplicate noise.
# Critical alerts are idempotent (only fire on UNSENT items) so re-running is safe.
# Manual workflow_dispatch always runs in full mode.
#
# Secrets required: SETSMART_API_KEY, ANTHROPIC_API_KEY, SURVEILLANCE_SQL,
#   EMAIL_USERNAME, EMAIL_APP_PASSWORD, EMAIL_FROM, EMAIL_TO,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET.

on:
  schedule:
    - cron: '50 2 * * 1-5'    # 09:50 BKK morning — full
    - cron: '30 10 * * 1-5'   # 17:30 BKK afternoon — critical only
  workflow_dispatch:
    inputs:
      mode:
        description: 'Email mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full              # all 3 modes — same as morning schedule
          - critical-only     # critical email only — same as afternoon schedule

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # JOB 1 — Surveillance (poll SET, classify, email alerts, upload DB)
  # ------------------------------------------------------------------
  surveillance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SURVEILLANCE_DB_PATH: /tmp/surveillance.duckdb
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install surveillance dependencies
        run: pip install -r surveillance/requirements.txt

      - name: Download surveillance.duckdb from R2
        # boto3-based; tolerates missing object (first run) by exiting 0 with a warning.
        run: python surveillance/r2_sync.py download

      - name: Health check (schema-drift smoke test)
        working-directory: surveillance
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python health_check.py

      - name: Poll SET disclosures (lookback 2 days)
        working-directory: surveillance
        run: python poll.py --lookback-days 2

      - name: Classify (rules first, Haiku fallback)
        working-directory: surveillance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python classify_batch.py

      - name: Send critical alerts (one batched email per RM)
        working-directory: surveillance
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python route_alerts.py --mode critical
        continue-on-error: true

      # Material digest + coverage-feed only run on the morning schedule (or manual dispatch).
      # Afternoon run skips them to avoid duplicate-content emails — coverage-feed is
      # non-idempotent and digest's value is the once-a-day RM-grouped summary.
      - name: Send material digest
        if: github.event.schedule != '30 10 * * 1-5' && inputs.mode != 'critical-only'
        working-directory: surveillance
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python route_alerts.py --mode digest
        continue-on-error: true

      - name: Send coverage feed (24h all-news email)
        if: github.event.schedule != '30 10 * * 1-5' && inputs.mode != 'critical-only'
        working-directory: surveillance
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python route_alerts.py --mode coverage-feed --hours-back 24
        continue-on-error: true

      - name: Upload surveillance.duckdb back to R2
        run: python surveillance/r2_sync.py upload

      - name: Upload DB as Actions artifact (audit trail, 30d retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surveillance-duckdb-${{ github.run_id }}
          path: ${{ env.SURVEILLANCE_DB_PATH }}
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------
  # JOB 2 — Build (download DB from R2, generate 4 JSONs, commit)
  # ------------------------------------------------------------------
  build:
    needs: surveillance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SURVEILLANCE_DB_PATH: /tmp/surveillance.duckdb
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Install boto3 for R2 sync
        run: pip install boto3==1.35.46

      - name: Download surveillance.duckdb from R2 (just-uploaded by surveillance job)
        run: python surveillance/r2_sync.py download

      # Fail fast on SETSMART auth/quota issues BEFORE the 15-min 231-ticker scan.
      # Uses the proxy's existing /probe/auth handler, which calls
      # eod-price-by-symbol for PTT (1 day) and surfaces 401/403/429 in seconds.
      - name: SETSMART API probe
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import asyncio, sys
          sys.path.insert(0, "scripts")
          import setsmart_proxy as p
          result = asyncio.run(p.probe_auth())
          # probe_auth returns either a plain dict (success) or JSONResponse (failure).
          if hasattr(result, "body"):
              import json
              payload = json.loads(result.body.decode("utf-8"))
          else:
              payload = result
          print(f"SETSMART probe: {payload}")
          if not payload.get("ok"):
              sys.exit(f"SETSMART auth failed: {payload}")
          PY

      - name: Run daily build (~15 min for 231 tickers)
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}
          # Custom SQL that JOINs news_items with classifications so disclosure-pulse
          # gets proper severity labels; without it the default query returns NULL severities.
          SURVEILLANCE_SQL: ${{ secrets.SURVEILLANCE_SQL }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build_daily.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "daily snapshot $(date -u +%Y-%m-%d)"
          # Race-safe push: rebase on top of any commits that landed during the
          # ~20-min build. The bot only touches data/*.json so conflicts are
          # nearly impossible. Retry up to 3 times with exponential backoff to
          # absorb transient network errors and concurrent bot pushes.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — rebasing and retrying..."
            git pull --rebase origin main || true
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1

      - name: Upload build status as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-status-${{ github.run_id }}
          path: data/build-status.json
          if-no-files-found: ignore
          retention-days: 14
