<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Movement — IS1 Team</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e2e8f0;
    --muted: #7c8298; --accent: #6366f1; --green: #22c55e; --red: #ef4444;
    --yellow: #f59e0b; --food: #3b82f6; --prop: #8b5cf6; --pfreit: #06b6d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .nav { display: flex; gap: 14px; align-items: center; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  .nav a:hover { color: var(--text); background: var(--border); }
  .nav a.active { color: var(--text); background: #6366f122; border: 1px solid #6366f155; }
  .stale { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #22c55e22; color: var(--green); border: 1px solid #22c55e33; }
  .stale.warn { background: #f59e0b22; color: var(--yellow); border-color: #f59e0b33; }

  /* Two-axis tab system */
  .tab-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tab-row { display: flex; gap: 4px; padding: 8px 0; align-items: center; }
  .tab-row + .tab-row { border-top: 1px dashed var(--border); }
  .tab-label { font-size: 11px; color: var(--muted); margin-right: 8px; min-width: 50px; }
  .tab { padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted); border: 1px solid transparent; user-select: none; }
  .tab:hover { color: var(--text); background: #2a2d3a; }
  .tab.active { background: #6366f122; border-color: #6366f155; color: var(--text); font-weight: 600; }
  .tab-count { color: var(--muted); margin-left: 4px; font-size: 10px; }
  .tab.active .tab-count { color: var(--accent); }

  /* Table */
  .table-wrap { overflow-x: auto; padding: 0 20px 20px; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--card); border: 1px solid var(--border); position: sticky; top: 0; }
  th { padding: 8px 10px; text-align: right; font-size: 11px; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; user-select: none; }
  th:first-child, th:nth-child(2), th:nth-child(3) { text-align: left; }
  th:hover { color: var(--text); }
  th.sort-asc::after { content: ' ↑'; color: var(--accent); }
  th.sort-desc::after { content: ' ↓'; color: var(--accent); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: right; }
  td:first-child { text-align: left; font-weight: 600; font-size: 13px; }
  td:nth-child(2) { text-align: left; font-size: 11px; color: var(--muted); }
  td:nth-child(3) { text-align: left; font-size: 11px; }
  tr:hover td { background: #1e2130; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--muted); }
  .sector-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .s-FOOD { background: #3b82f622; color: var(--food); }
  .s-AGRI { background: #3b82f622; color: var(--food); }
  .s-PROP { background: #8b5cf622; color: var(--prop); }
  .s-CONS { background: #8b5cf622; color: var(--prop); }
  .s-CONMAT { background: #8b5cf622; color: var(--prop); }
  .s-PFREIT { background: #06b6d422; color: var(--pfreit); }
  .s-PF\&REIT { background: #06b6d422; color: var(--pfreit); }
  .rm-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; background: #6366f122; color: #a5b4fc; }
  .sparkline { display: inline-block; }
  .hi52 { background: #22c55e22; }
  .lo52 { background: #ef444422; }
  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .summary-bar { display: flex; gap: 16px; padding: 8px 20px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); }
  .summary-bar strong { color: var(--text); }

  /* Book treemap: each box is a ticker sized by market cap and shaded by the
     selected return, grouped by sector. */
  .tm { margin: 14px 20px; padding: 12px 14px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  .tm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .tm-head strong { font-size: 13px; }
  .tm-head span { color: var(--muted); font-size: 11px; }
  .tm-metric { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 7px; }
  .tm-metric button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 5px; cursor: pointer; }
  .tm-metric button.active { color: var(--text); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .tm-box { position: relative; height: 380px; }
  .tm-sector { position: absolute; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--bg); }
  .tm-sector > b { position: absolute; left: 6px; top: 1px; font-size: 10px; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
  .tm-cell { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--card); border-radius: 3px; color: var(--text); text-decoration: none; line-height: 1.15; transition: filter .12s; }
  .tm-cell:hover { filter: brightness(1.12); z-index: 1; outline: 1px solid var(--text); }
  .tm-cell b { font-size: 11px; }
  .tm-cell i { font-style: normal; font-size: 10px; font-variant-numeric: tabular-nums; opacity: .85; }
  .tm-cell.sm i { display: none; }
  .tm-cell.xs b, .tm-cell.xs i { display: none; }
  .tm-scale { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 10px; }
  .tm-scale div { width: 160px; height: 7px; border-radius: 4px; background: linear-gradient(90deg, var(--red), color-mix(in srgb, var(--muted) 30%, var(--card)), var(--green)); }
  @media (max-width: 720px) { .tm { margin: 12px; } .tm-box { height: 300px; } }
</style>
  <script src="theme.js?v=8"></script>
  <link rel="stylesheet" href="theme.css?v=9">

<div class="tab-bar">

        <th data-key="pctMtd" data-num>MTD%</th>
        <th data-key="pctYtd" data-num>YTD%</th>

<script>
let TICKERS = [], BRIEF_BY_TK = {};
let activeRm = /^[CKOGPT]$/.test(localStorage.getItem('is1_rm') || '') ? localStorage.getItem('is1_rm') : 'ALL', activeSector = 'ALL';
let sortKey = null, sortDir = 1;
let BRIEF_META = null;

const TT_FALLBACK = {
  "common.dotUpdatedAgo": "● updated {x} ago",
  "common.all": "All",
  "price.summary": "Showing {n} tickers · RM {rm} · Sector {sector}{missing}",
  "price.noPrice": " · {n} no price",
  "price.errorLoading": "Error loading data: {msg}. Check that data/morning-brief.json exists.",
  "price.asOfMeta": "As of {asOf} · {n} tickers · {source}",
};
function tt(key) { return window.I18N ? I18N.t(key) : (TT_FALLBACK[key] || key); }
function tx(key, vars) {
  return tt(key).replace(/\{(\w+)\}/g, (_, k) => vars && vars[k] != null ? vars[k] : '');
}
function ageText(builtAt) {
  if (!builtAt) return '?';
  const d = new Date(builtAt);
  const ageH = (Date.now() - d.getTime()) / 36e5;
  return ageH < 1 ? Math.round(ageH * 60) + 'm' : Math.round(ageH) + 'h';
}

function pct(v) {
  if (v == null) return '<span class="neu">—</span>';
  const c = v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';
  return `<span class="${c}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
}

function sparkSvg(path) {
  if (!path || !path.length) return '';
  const w = 90, h = 24, min = Math.min(...path), max = Math.max(...path);
  const range = max - min || 1;
  const pts = path.map((v, i) => {
    const x = (i / (path.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const last = path[path.length - 1], first = path[0];
  const col = last > first ? '#22c55e' : last < first ? '#ef4444' : '#7c8298';
  return `<svg width="${w}" height="${h}" class="sparkline"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`;
}

function freshnessLabel(builtAt) {
  if (!builtAt) return { txt: '?', warn: true };
  const d = new Date(builtAt);
  const ageH = (Date.now() - d.getTime()) / 36e5;
  const txt = tx('common.dotUpdatedAgo', { x: ageText(builtAt) });
  return { txt, warn: ageH > 36 };
}

function allLabel() { return tt('common.all'); }

function buildTabs() {
  // RM tabs
  const rmCounts = {};
  TICKERS.forEach(t => { rmCounts[t.rm] = (rmCounts[t.rm] || 0) + 1; });
  const rms = Object.keys(rmCounts).sort((a, b) => rmCounts[b] - rmCounts[a]);
  document.getElementById('rmTabs').innerHTML = `
    <div class="tab ${activeRm === 'ALL' ? 'active' : ''}" data-rm="ALL" onclick="setRm('ALL')">${allLabel()} <span class="tab-count">${TICKERS.length}</span></div>
    ${rms.map(r => `<div class="tab ${activeRm === r ? 'active' : ''}" data-rm="${r}" onclick="setRm('${r}')">${r} <span class="tab-count">${rmCounts[r]}</span></div>`).join('')}`;

  // Sector tabs
  const secCounts = {};
  TICKERS.forEach(t => { secCounts[t.sector] = (secCounts[t.sector] || 0) + 1; });
  const secs = Object.keys(secCounts).sort();
  document.getElementById('sectorTabs').innerHTML = `
    <div class="tab ${activeSector === 'ALL' ? 'active' : ''}" data-sector="ALL" onclick="setSector('ALL')">${allLabel()}</div>
    ${secs.map(s => `<div class="tab ${activeSector === s ? 'active' : ''}" data-sector="${s}" onclick="setSector('${s}')">${s} <span class="tab-count">${secCounts[s]}</span></div>`).join('')}`;
}

function setRm(rm) {
  activeRm = rm;
  document.querySelectorAll('[data-rm]').forEach(el => el.classList.toggle('active', el.dataset.rm === rm));
  render();
}
window.addEventListener('is1:rm-change', e => {
  if (/^(ALL|[CKOGPT])$/.test(e.detail?.rm || '')) setRm(e.detail.rm);
});
function setSector(s) {
  activeSector = s;
  document.querySelectorAll('[data-sector]').forEach(el => el.classList.toggle('active', el.dataset.sector === s));
  render();
}

function render() {
  let rows = TICKERS.filter(t => {
    if (activeRm !== 'ALL' && t.rm !== activeRm) return false;
    if (activeSector !== 'ALL' && t.sector !== activeSector) return false;
    return true;
  }).map(t => {
    const b = BRIEF_BY_TK[t.tk] || {};
    return { ...b, tk: t.tk, rm: t.rm, sector: t.sector };
  });

  if (sortKey) {
    rows.sort((a, b) => {
      const va = a[sortKey], vb = b[sortKey];
      if (va == null) return 1; if (vb == null) return -1;
      if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
      return (va - vb) * sortDir;
    });
  }

  const missing = rows.filter(r => r.last == null).length;
  document.getElementById('summaryBar').innerHTML = tx('price.summary', {
    n: `<strong>${rows.length}</strong>`,
    rm: `<strong>${activeRm === 'ALL' ? allLabel() : activeRm}</strong>`,
    sector: `<strong>${activeSector === 'ALL' ? allLabel() : activeSector}</strong>`,
    missing: missing > 0 ? `<span style="color:var(--yellow)">${tx('price.noPrice', { n: missing })}</span>` : ''
  });

  document.getElementById('tbody').innerHTML = rows.map(r => `
    <tr class="${r.hi52 ? 'hi52' : r.lo52 ? 'lo52' : ''}">
      <td>${r.tk}</td>
      <td><span class="rm-badge">${r.rm}</span></td>
      <td><span class="sector-badge s-${r.sector.replace('&','')}">${r.sector}</span></td>
      <td>${r.last != null ? r.last.toFixed(2) : '<span class="neu">—</span>'}</td>
      <td>${pct(r.pct1d)}</td>
      <td>${pct(r.pct5d)}</td>
      <td>${pct(r.pctMtd)}</td>
      <td>${pct(r.pctYtd)}</td>
      <td class="${r.volRatio > 1.5 ? 'pos' : r.volRatio < 0.5 ? 'neg' : 'neu'}">${r.volRatio != null ? r.volRatio.toFixed(2) + 'x' : '—'}</td>
      <td>${r.filings ? `<span style="color:var(--yellow)">⚡ ${r.filings}</span>` : '<span class="neu">—</span>'}</td>
      <td>${sparkSvg(r.path)}</td>
    </tr>`).join('');
  renderTreemap();
}


// ── Book treemap ─────────────────────────────────────────────────────────────
// Box area = market cap (ticker-summary.json, THB), colour = selected return
// from morning-brief.json. Colour saturates at the cap for each horizon.
let MCAP = null, tmMetric = 'pct1d';
const TM_METRICS = [['pct1d', '1D', 5], ['pct5d', '5D', 10], ['pctMtd', 'MTD', 15], ['pctYtd', 'YTD', 30]];
fetch('./data/ticker-summary.json').then(r => r.ok ? r.json() : null).then(d => {
  MCAP = {};
  (d?.tickers || []).forEach(t => { if (t.mktcap > 0) MCAP[t.tk] = t.mktcap; });
  if (TICKERS.length) renderTreemap();
}).catch(() => {});

function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, i) => s + i.v, 0);
  if (!total || w <= 0 || h <= 0) return out;
  let rest = items.map(i => ({ ...i, a: i.v * w * h / total }));
  const worst = (row, side) => {
    const s = row.reduce((t, r) => t + r.a, 0);
    const mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a));
    return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn));
  };
  while (rest.length) {
    const side = Math.min(w, h);
    let n = 1;
    while (n < rest.length && worst(rest.slice(0, n + 1), side) <= worst(rest.slice(0, n), side)) n++;
    const row = rest.slice(0, n), s = row.reduce((t, r) => t + r.a, 0);
    if (w >= h) {
      const cw = s / h; let cy = y;
      row.forEach(r => { const rh = r.a / cw; out.push({ ...r, x, y: cy, w: cw, h: rh }); cy += rh; });
      x += cw; w -= cw;
    } else {
      const rh = s / w; let cx = x;
      row.forEach(r => { const rw = r.a / rh; out.push({ ...r, x: cx, y, w: rw, h: rh }); cx += rw; });
      y += rh; h -= rh;
    }
    rest = rest.slice(n);
  }
  return out;
}

function tmColor(v, cap) {
  if (v == null) return 'color-mix(in srgb, var(--muted) 18%, var(--card))';
  const k = Math.min(1, Math.abs(v) / cap);
  const pctMix = Math.round(14 + k * 66);
  return `color-mix(in srgb, ${v >= 0 ? 'var(--green)' : 'var(--red)'} ${v === 0 ? 0 : pctMix}%, color-mix(in srgb, var(--muted) 18%, var(--card)))`;
}

function renderTreemap() {
  const host = document.getElementById('treemap');
  if (!MCAP) return;
  const isThai = window.I18N && I18N.lang === 'th';
  const L = (en, th) => isThai ? th : en;
  const scope = TICKERS.filter(t => (activeRm === 'ALL' || t.rm === activeRm) && (activeSector === 'ALL' || t.sector === activeSector));
  const sized = scope.filter(t => MCAP[t.tk]);
  if (!sized.length) { host.hidden = true; return; }
  host.hidden = false;
  const [, mLabel, cap] = TM_METRICS.find(m => m[0] === tmMetric);
  const groups = {};
  sized.forEach(t => { (groups[t.sector] = groups[t.sector] || []).push({ tk: t.tk, sector: t.sector, v: MCAP[t.tk] }); });
  const sectors = Object.entries(groups).map(([sec, items]) => ({ sec, items: items.sort((a, b) => b.v - a.v), v: items.reduce((s, i) => s + i.v, 0) }))
    .sort((a, b) => b.v - a.v);
  const totalBn = sectors.reduce((s, g) => s + g.v, 0) / 1e9;
  host.innerHTML = `
    <div class="tm-head">
      <div><strong>${esc(L('Book map', 'แผนที่พอร์ต'))}</strong>
        <span> · ${sized.length} ${esc(L('names', 'บริษัท'))} · ${esc(L('market cap', 'มูลค่าตลาด'))} THB ${Math.round(totalBn).toLocaleString('en-US')} bn${scope.length > sized.length ? ` · ${scope.length - sized.length} ${esc(L('without market cap', 'ไม่มีมูลค่าตลาด'))}` : ''}</span></div>
      <div class="tm-metric" role="tablist">${TM_METRICS.map(([k, lab]) => `<button type="button" role="tab" data-tm="${k}" class="${k === tmMetric ? 'active' : ''}" aria-selected="${k === tmMetric}">${lab}</button>`).join('')}</div>
    </div>
    <div class="tm-box" id="tmBox"></div>
    <div class="tm-scale"><span>−${cap}%</span><div></div><span>+${cap}%</span><span>· ${esc(L('box size = market cap, colour = ' + mLabel + ' return', 'ขนาด = มูลค่าตลาด, สี = ผลตอบแทน ' + mLabel))}</span></div>`;
  const box = document.getElementById('tmBox');
  const W = box.clientWidth, H = box.clientHeight, HEAD = 15;
  const fmt = v => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
  box.innerHTML = squarify(sectors, 0, 0, W, H).map(g => {
    const pad = 2;
    const cells = squarify(g.items, pad, HEAD, g.w - pad * 2, g.h - HEAD - pad).map(c => {
      const b = BRIEF_BY_TK[c.tk] || {};
      const v = b[tmMetric];
      const size = c.w < 40 || c.h < 18 ? ' xs' : c.w < 60 || c.h < 32 ? ' sm' : '';
      const tip = `${c.tk} · ${c.sector} · ${b.last != null ? b.last.toFixed(2) + ' THB' : '—'} · ${mLabel} ${fmt(v)} · ${L('market cap', 'มูลค่าตลาด')} THB ${Math.round(c.v / 1e6).toLocaleString('en-US')} mn`;
      return `<a class="tm-cell${size}" href="company-summary.html?tk=${encodeURIComponent(c.tk)}" title="${esc(tip)}" style="left:${c.x.toFixed(1)}px;top:${c.y.toFixed(1)}px;width:${c.w.toFixed(1)}px;height:${c.h.toFixed(1)}px;background:${tmColor(v, cap)}"><b>${esc(c.tk)}</b><i>${fmt(v)}</i></a>`;
    }).join('');
    return `<div class="tm-sector" style="left:${g.x.toFixed(1)}px;top:${g.y.toFixed(1)}px;width:${g.w.toFixed(1)}px;height:${g.h.toFixed(1)}px"><b>${esc(g.sec)}</b>${cells}</div>`;
  }).join('');
}
document.getElementById('treemap').addEventListener('click', e => {
  const k = e.target.closest('[data-tm]')?.dataset.tm;
  if (k) { tmMetric = k; renderTreemap(); }
});
let tmW = 0;
new ResizeObserver(entries => {
  const w = Math.round(entries[0].contentRect.width);
  if (w !== tmW) { tmW = w; if (MCAP && TICKERS.length) renderTreemap(); }
}).observe(document.getElementById('treemap'));
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.key;
    if (sortKey === k) sortDir = -sortDir;
    else { sortKey = k; sortDir = th.hasAttribute('data-num') ? -1 : 1; }
    document.querySelectorAll('th').forEach(t => t.classList.remove('sort-asc', 'sort-desc'));
    th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    render();
  });
});

async function init() {
  try {
    const [tickersRes, briefRes] = await Promise.all([
      fetch('./data/tickers.json'), fetch('./data/morning-brief.json')
    ]);
    if (!tickersRes.ok || !briefRes.ok) throw new Error('fetch failed');
    const tickersJson = await tickersRes.json();
    const brief = await briefRes.json();
    BRIEF_META = brief;
    TICKERS = tickersJson.tickers;
    (brief.rows || []).forEach(r => { BRIEF_BY_TK[r.tk] = r; });

    const fresh = freshnessLabel(brief._built_at);
    const badge = document.getElementById('staleBadge');
    badge.textContent = fresh.txt;
    if (fresh.warn) badge.classList.add('warn');

    updateHeaderMeta();
    buildTabs();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('tbl').style.display = '';
    render();
  } catch(e) {
    document.getElementById('loading').textContent = tx('price.errorLoading', { msg: e.message });
  }
}
init();

function updateHeaderMeta() {
  if (!BRIEF_META) return;
  const fresh = freshnessLabel(BRIEF_META._built_at);
  const badge = document.getElementById('staleBadge');
  badge.textContent = fresh.txt;
  badge.classList.toggle('warn', fresh.warn);
  document.getElementById('meta').textContent = tx('price.asOfMeta', {
    asOf: BRIEF_META.asOf || '',
    n: TICKERS.length,
    source: BRIEF_META.source || ''
  });
}

window.addEventListener('i18n:change', () => {
  if (window.I18N) I18N.apply();
  updateHeaderMeta();
  if (TICKERS.length) {
    buildTabs();
    render();
  }
});
</script>
