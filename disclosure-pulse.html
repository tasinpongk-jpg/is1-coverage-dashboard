<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Disclosure Pulse — IS1 Team</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e2e8f0;
    --muted: #7c8298; --accent: #6366f1;
    --crit: #ef4444; --mat: #f59e0b; --low: #22c55e; --routine: #7c8298;
    --food: #3b82f6; --prop: #8b5cf6; --pfreit: #06b6d4; --green: #22c55e; --yellow: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { font-size: 16px; font-weight: 600; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .nav { display: flex; gap: 14px; align-items: center; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  .nav a:hover { color: var(--text); background: var(--border); }
  .nav a.active { color: var(--text); background: #6366f122; border: 1px solid #6366f155; }
  .stale { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #22c55e22; color: var(--green); border: 1px solid #22c55e33; }
  .stale.warn { background: #f59e0b22; color: var(--yellow); border-color: #f59e0b33; }

  .tab-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tab-row { display: flex; gap: 4px; padding: 8px 0; align-items: center; flex-wrap: wrap; }
  .tab-row + .tab-row { border-top: 1px dashed var(--border); }
  .tab-label { font-size: 11px; color: var(--muted); margin-right: 8px; min-width: 60px; }
  .tab { padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted); border: 1px solid transparent; user-select: none; }
  .tab:hover { color: var(--text); background: #2a2d3a; }
  .tab.active { background: #6366f122; border-color: #6366f155; color: var(--text); font-weight: 600; }
  .tab-count { color: var(--muted); margin-left: 4px; font-size: 10px; }

  .stats { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .stat { flex: 1; text-align: center; padding: 10px; border-right: 1px solid var(--border); }
  .stat:last-child { border-right: none; }
  .stat-val { font-size: 18px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: var(--muted); }

  .feed { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 8px; }
  .filing { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; border-left: 3px solid var(--routine); }
  .filing.critical { border-left-color: var(--crit); }
  .filing.material { border-left-color: var(--mat); }
  .filing.low { border-left-color: var(--low); }
  .filing-top { display: flex; align-items: flex-start; gap: 10px; }
  .filing-tk { font-weight: 700; font-size: 14px; min-width: 70px; }
  .filing-content { flex: 1; }
  .filing-title { font-size: 13px; line-height: 1.4; }
  .filing-title a { color: var(--text); text-decoration: none; }
  .filing-title a:hover { color: var(--accent); text-decoration: underline; }
  .filing-meta { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
  .sev-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
  .sev-critical, .sev-high { background: #ef444433; color: var(--crit); }
  .sev-material, .sev-medium { background: #f59e0b33; color: var(--mat); }
  .sev-low { background: #22c55e22; color: var(--low); }
  .sev-routine { background: #7c829822; color: var(--routine); }
  .filing.high { border-left-color: var(--crit); }
  .filing.medium { border-left-color: var(--mat); }
  .rm-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; background: #6366f122; color: #a5b4fc; }
  .sector-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .s-FOOD, .s-AGRI { background: #3b82f622; color: var(--food); }
  .s-PROP, .s-CONS, .s-CONMAT { background: #8b5cf622; color: var(--prop); }
  .s-PFREIT { background: #06b6d422; color: var(--pfreit); }
  .ts { font-size: 11px; color: var(--muted); }
  .summary { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.4; font-style: italic; }
  .empty, .loading { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Disclosure Pulse <span style="color:var(--muted);font-weight:400;font-size:13px">— IS1 Team</span></h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <nav class="nav">
    <a href="coverage-morning-brief.html">Brief</a>
    <a href="disclosure-pulse.html" class="active">Disclosures</a>
    <a href="sector-heatmap.html">Heatmap</a>
    <a href="unusual-trading.html">Alerts</a>
    <span class="stale" id="staleBadge">●</span>
  </nav>
</header>

<div class="stats" id="statsBar"></div>

<div class="tab-bar">
  <div class="tab-row">
    <span class="tab-label">Window:</span>
    <div id="windowTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
  <div class="tab-row">
    <span class="tab-label">RM:</span>
    <div id="rmTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
  <div class="tab-row">
    <span class="tab-label">Severity:</span>
    <div id="sevTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
    <span class="tab-label" style="margin-left:20px">Sector:</span>
    <div id="sectorTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
</div>

<div id="feed" class="feed"><div class="loading">Fetching disclosures…</div></div>

<script>
let TICKERS = {}, FILINGS = [];
let activeRm = 'ALL', activeSev = 'ALL', activeSector = 'ALL';
let activeWindow = 1;   // days; 0 = ALL

const WINDOWS = [
  { key: 1,  label: '1d' },
  { key: 3,  label: '3d' },
  { key: 7,  label: '7d' },
  { key: 14, label: '14d' },
  { key: 30, label: '30d' },
  { key: 0,  label: 'All' },
];

function freshnessLabel(builtAt) {
  if (!builtAt) return { txt: '?', warn: true };
  const ageH = (Date.now() - new Date(builtAt).getTime()) / 36e5;
  return { txt: `● updated ${ageH < 1 ? Math.round(ageH * 60) + 'm' : Math.round(ageH) + 'h'} ago`, warn: ageH > 36 };
}

function formatTs(ts) {
  if (!ts) return '';
  try { return new Date(ts).toLocaleString('th-TH', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
  catch { return ts; }
}

function buildWindowTabs() {
  document.getElementById('windowTabs').innerHTML = WINDOWS.map(w => {
    const cls = w.key === activeWindow ? 'tab active' : 'tab';
    return `<div class="${cls}" data-window="${w.key}" onclick="setWindow(${w.key})">${w.label}</div>`;
  }).join('');
}

function buildRmTabs() {
  // Counts respect the current time-window so the user sees how many filings
  // each RM has in that window
  const inWin = FILINGS.filter(inWindow);
  const rmCounts = {};
  inWin.forEach(f => { const r = (TICKERS[f.tk] || {}).rm || '?'; rmCounts[r] = (rmCounts[r] || 0) + 1; });
  const rms = Object.keys(rmCounts).sort((a, b) => rmCounts[b] - rmCounts[a]);
  document.getElementById('rmTabs').innerHTML = `
    <div class="tab ${activeRm === 'ALL' ? 'active' : ''}" data-rm="ALL" onclick="setRm('ALL')">All <span class="tab-count">${inWin.length}</span></div>
    ${rms.map(r => `<div class="tab ${activeRm === r ? 'active' : ''}" data-rm="${r}" onclick="setRm('${r}')">${r} <span class="tab-count">${rmCounts[r]}</span></div>`).join('')}`;
}

function buildSevTabs() {
  // Severity — map UI labels to actual data values (proxy emits high/medium/low)
  const sevTabs = [
    { key: 'ALL',    label: 'All',      color: '' },
    { key: 'high',   label: 'Critical', color: 'color:var(--crit)' },
    { key: 'medium', label: 'Material', color: 'color:var(--mat)' },
    { key: 'low',    label: 'Low',      color: 'color:var(--low)' },
  ];
  document.getElementById('sevTabs').innerHTML = sevTabs.map(t => {
    const cls = t.key === activeSev ? 'tab active' : 'tab';
    return `<div class="${cls}" style="${t.color}" data-sev="${t.key}" onclick="setSev('${t.key}')">${t.label}</div>`;
  }).join('');
}

function buildSectorTabs() {
  // Counts respect the current time-window AND active RM so the user sees what's relevant
  const inScope = FILINGS.filter(f =>
    inWindow(f) && (activeRm === 'ALL' || (TICKERS[f.tk] || {}).rm === activeRm)
  );
  // Canonical coverage sectors — always rendered as chips even at count 0 so a
  // quiet sector (e.g. AGRI on a slow day) stays visible and obviously zero
  // rather than silently vanishing from the filter row.
  const canonical = ['AGRI','FOOD','CONS','CONMAT','PROP','PFREIT'];
  const secCounts = {};
  inScope.forEach(f => { secCounts[f.sector] = (secCounts[f.sector] || 0) + 1; });
  // Unexpected sectors in data (legacy 'PF&REIT' spelling, future additions)
  // append after the canonical six so we don't drop them on the floor.
  const extra = Object.keys(secCounts).filter(s => !canonical.includes(s)).sort();
  const sectors = ['ALL', ...canonical, ...extra];
  document.getElementById('sectorTabs').innerHTML = sectors.map(s => {
    const cls = s === activeSector ? 'tab active' : 'tab';
    const cnt = s === 'ALL' ? inScope.length : (secCounts[s] || 0);
    return `<div class="${cls}" data-sector="${s}" onclick="setSector('${s}')">${s === 'ALL' ? 'All' : s} <span class="tab-count">${cnt}</span></div>`;
  }).join('');
}

function buildTabs() {
  buildWindowTabs();
  buildRmTabs();
  buildSevTabs();
  buildSectorTabs();
}

function setRm(r) { activeRm = r; document.querySelectorAll('[data-rm]').forEach(el => el.classList.toggle('active', el.dataset.rm === r)); render(); updateStats(); buildSectorTabs(); }
function setSev(s) { activeSev = s; document.querySelectorAll('[data-sev]').forEach(el => el.classList.toggle('active', el.dataset.sev === s)); render(); }
function setSector(s) { activeSector = s; document.querySelectorAll('[data-sector]').forEach(el => el.classList.toggle('active', el.dataset.sector === s)); render(); }
function setWindow(d) { activeWindow = +d; document.querySelectorAll('[data-window]').forEach(el => el.classList.toggle('active', +el.dataset.window === activeWindow)); render(); updateStats(); buildSectorTabs(); buildRmTabs(); }

// Filings inside the active time window (does NOT apply the other filters — used by stats counters)
function inWindow(f) {
  if (activeWindow === 0) return true;
  if (!f.ts) return false;
  const t = new Date(f.ts).getTime();
  if (Number.isNaN(t)) return false;
  return (Date.now() - t) <= activeWindow * 86400 * 1000;
}

function filtered() {
  return FILINGS.filter(f => {
    if (!inWindow(f)) return false;
    const t = TICKERS[f.tk] || {};
    if (activeRm !== 'ALL' && t.rm !== activeRm) return false;
    if (activeSev !== 'ALL' && (f.severity || 'low').toLowerCase() !== activeSev) return false;
    if (activeSector !== 'ALL' && f.sector !== activeSector) return false;
    return true;
  });
}

// Display label for a severity value
const SEV_LABEL = { high: 'Critical', medium: 'Material', low: 'Low', critical: 'Critical', material: 'Material', routine: 'Routine' };

function updateStats() {
  // Stats reflect window + RM (severity / sector are filtered IN the feed, not the stats)
  const rows = FILINGS.filter(f =>
    inWindow(f) && (activeRm === 'ALL' || (TICKERS[f.tk] || {}).rm === activeRm)
  );
  const counts = { high: 0, medium: 0, low: 0 };
  rows.forEach(f => { const k = (f.severity || 'low').toLowerCase(); if (counts[k] !== undefined) counts[k]++; });
  const winLabel = (WINDOWS.find(w => w.key === activeWindow) || {}).label || '?';
  document.getElementById('statsBar').innerHTML = `
    <div class="stat" style="color:var(--crit)"><div class="stat-val">${counts.high}</div><div class="stat-lbl">Critical</div></div>
    <div class="stat" style="color:var(--mat)"><div class="stat-val">${counts.medium}</div><div class="stat-lbl">Material</div></div>
    <div class="stat" style="color:var(--low)"><div class="stat-val">${counts.low}</div><div class="stat-lbl">Low</div></div>
    <div class="stat"><div class="stat-val">${rows.length}</div><div class="stat-lbl">Total · ${winLabel}</div></div>`;
}

function render() {
  const rows = filtered();
  const feed = document.getElementById('feed');
  if (!rows.length) { feed.innerHTML = '<div class="empty">No disclosures matching filters.</div>'; return; }
  feed.innerHTML = rows.map(f => {
    const sev = (f.severity || 'low').toLowerCase();
    const sevLabel = SEV_LABEL[sev] || sev;
    const t = TICKERS[f.tk] || {};
    const summ = f._summary || f.summary || '';
    return `<div class="filing ${sev}">
      <div class="filing-top">
        <div class="filing-tk">${f.tk}</div>
        <div class="filing-content">
          <div class="filing-title">${f.url ? `<a href="${f.url}" target="_blank" rel="noopener">${f.title || f.headline || '—'}</a>` : (f.title || f.headline || '—')}</div>
          <div class="filing-meta">
            <span class="sev-badge sev-${sev}">${sevLabel}</span>
            ${t.rm ? `<span class="rm-badge">${t.rm}</span>` : ''}
            <span class="sector-badge s-${f.sector}">${f.sector}</span>
            ${f.type ? `<span style="font-size:10px;color:var(--muted)">${f.type}</span>` : ''}
            <span class="ts">${formatTs(f.ts)}</span>
          </div>
          ${summ ? `<div class="summary">${summ}</div>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function init() {
  try {
    const [tj, dj] = await Promise.all([
      fetch('./data/tickers.json').then(r => r.json()),
      fetch('./data/disclosure-pulse.json').then(r => r.json()),
    ]);
    tj.tickers.forEach(t => { TICKERS[t.tk] = t; });
    FILINGS = dj.filings || [];
    const fresh = freshnessLabel(dj._built_at);
    const badge = document.getElementById('staleBadge');
    badge.textContent = fresh.txt;
    if (fresh.warn) badge.classList.add('warn');
    document.getElementById('meta').textContent = `${FILINGS.length} filings classified · ${dj.windowDays || 90}d data window · as of ${dj.asOf || ''} · ${dj.source || ''}`;
    buildTabs(); updateStats(); render();
  } catch(e) {
    document.getElementById('feed').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}
init();
</script>
</body>
</html>
