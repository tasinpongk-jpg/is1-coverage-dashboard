<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Insights — IS1 Team</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e2e8f0;
    --muted: #7c8298; --accent: #6366f1;
    --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { font-size: 16px; font-weight: 600; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .nav { display: flex; gap: 14px; align-items: center; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  .nav a:hover { color: var(--text); background: var(--border); }
  .nav a.active { color: var(--text); background: #6366f122; border: 1px solid #6366f155; }
  .stale { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #22c55e22; color: var(--green); border: 1px solid #22c55e33; }
  .stale.warn { background: #f59e0b22; color: var(--yellow); border-color: #f59e0b33; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .headline { background: linear-gradient(135deg, #6366f118, #1a1d27); border: 1px solid #6366f155; border-radius: 10px; padding: 20px; }
  .headline h2 { font-size: 18px; font-weight: 700; line-height: 1.45; }
  .take { color: var(--text); font-size: 13.5px; line-height: 1.65; margin-top: 10px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .col { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .col-name { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; color: var(--muted); }
  .col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .col li { padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: #0f1117; font-size: 12.5px; line-height: 1.5; }
  .tk { font-weight: 700; color: var(--accent); }
  .rm-tag { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; margin-left: 6px; }
  .sec-tag { font-weight: 700; color: var(--text); margin-right: 6px; }
  .risk li { border-left: 3px solid var(--red); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .foot { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 24px; }

</style>
  <script src="theme.js?v=6"></script>
  <link rel="stylesheet" href="theme.css?v=6">
  <script src="i18n.js?v=6"></script>

</head>
<body>

<header>
  <div>
    <h1><span data-i18n="page.aiInsights">AI Insights</span> <span style="color:var(--muted);font-weight:400;font-size:13px">— model-written morning commentary on the coverage</span></h1>
    <div class="meta" id="meta" data-i18n="common.loadingDots">Loading...</div>
  </div>
  <nav class="nav">
    <a href="index.html" data-i18n="nav.index">Index</a>
    <a href="price-movement.html" data-i18n="page.priceMovement">Price Movement</a>
    <a href="disclosure-pulse.html" data-i18n="nav.disclosures">Disclosures</a>
    <a href="multiples-comparison.html" data-i18n="page.multiplesComparison">Multiples Comparison</a>
    <a href="company-summary.html" data-i18n="page.companySummary">Company Summary</a>
    <a href="unusual-trading.html" data-i18n="nav.alerts">Alerts</a>
    <a href="external-news.html" data-i18n="nav.external">External</a>
    <a href="ai-insights.html" class="active" data-i18n="nav.ai">AI</a>
    <span class="stale" id="staleBadge">..</span>
  </nav>
</header>

<div id="wrap" class="wrap"><div class="empty" data-i18n="common.loadingDots">Loading...</div></div>

<script>
let AI_DATA = null, AI_ERROR = null;
let ACTIVE_RM = /^[CKOGPT]$/.test(localStorage.getItem('is1_rm') || '') ? localStorage.getItem('is1_rm') : 'C';
const TT_FALLBACK = {
  "common.updatedAgo": "updated {x} ago",
  "ai.notReady": "The AI commentary appears after the first daily build with GROQ_API_KEY configured.",
  "common.asOfDate": "as of {date}",
  "common.generatedBy": "generated by {model}; commentary is model output, verify before acting",
  "ai.watchlist": "Watchlist",
  "ai.nothingFlagged": "Nothing flagged.",
  "ai.sectorNotes": "Sector Notes",
  "ai.noSectorNotes": "No sector notes.",
  "ai.riskFlags": "Risk Flags",
  "ai.noRiskFlags": "No risk flags.",
  "ai.foot": "Generated daily after the morning build from the same snapshots that power this dashboard (morning brief, unusual trading, disclosure pulse). Model output — not investment advice.",
};
function tt(key) { return window.I18N ? I18N.t(key) : (TT_FALLBACK[key] || key); }
function tx(key, vars) { return tt(key).replace(/\{(\w+)\}/g, (_, k) => vars && vars[k] != null ? vars[k] : ''); }
function freshnessLabel(builtAt) {
  if (!builtAt) return { txt: '?', warn: true };
  const ageH = (Date.now() - new Date(builtAt).getTime()) / 36e5;
  const x = ageH < 1 ? Math.round(ageH * 60) + 'm' : Math.round(ageH) + 'h';
  return { txt: tx('common.updatedAgo', { x }), warn: ageH > 36 };
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render() {
  if (AI_ERROR) {
    document.getElementById('wrap').innerHTML = `<div class="empty">${esc(AI_ERROR.message)}<br><br>${tt('ai.notReady')}</div>`;
    return;
  }
  const d = AI_DATA ? {...AI_DATA, watchlist:(AI_DATA.watchlist || []).filter(w=>w.rm===ACTIVE_RM)} : null;
  if (!d) return;
  const fresh = freshnessLabel(d._built_at);
  const badge = document.getElementById('staleBadge');
  badge.textContent = fresh.txt;
  badge.classList.toggle('warn', fresh.warn);
  document.getElementById('meta').textContent = `${tx('common.asOfDate', { date: d.asOf || '?' })} — ${tx('common.generatedBy', { model: d.model || 'AI' })}`;

  document.getElementById('wrap').innerHTML = `
    <div class="headline">
      <h2>${esc(d.headline)}</h2>
      <div class="take">${esc(d.market_take)}</div>
    </div>
    <div class="grid">
      <div class="col">
        <div class="col-name">${tt('ai.watchlist')}</div>
        <ul>${(d.watchlist || []).map(w => `<li><span class="tk">${esc(w.tk)}</span><span class="rm-tag">${esc(w.rm)}</span><br>${esc(w.reason)}</li>`).join('') || `<li>${tt('ai.nothingFlagged')}</li>`}</ul>
      </div>
      <div class="col">
        <div class="col-name">${tt('ai.sectorNotes')}</div>
        <ul>${(d.sector_notes || []).map(s => `<li><span class="sec-tag">${esc(s.sector)}</span>${esc(s.note)}</li>`).join('') || `<li>${tt('ai.noSectorNotes')}</li>`}</ul>
      </div>
      <div class="col risk">
        <div class="col-name">${tt('ai.riskFlags')}</div>
        <ul>${(d.risk_flags || []).map(r => `<li>${esc(r)}</li>`).join('') || `<li>${tt('ai.noRiskFlags')}</li>`}</ul>
      </div>
    </div>
    <div class="foot">${tt('ai.foot')}</div>`;
}
async function init() {
  try {
    const d = await fetch('./data/ai-insights.json').then(r => { if (!r.ok) throw new Error('no insights yet (HTTP ' + r.status + ')'); return r.json(); });
    AI_DATA = d;
    render();
  } catch(e) {
    AI_ERROR = e;
    render();
  }
}
init();
window.addEventListener('is1:rm-change',e=>{
  if(/^[CKOGPT]$/.test(e.detail?.rm||'')){ACTIVE_RM=e.detail.rm;render();}
});
window.addEventListener('i18n:change', () => {
  if (window.I18N) I18N.apply();
  render();
});
</script>
<script src="nav.js?v=6" defer></script>
<script src="chat-dock.js?v=6" defer></script>
</body>
</html>
