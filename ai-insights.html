<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Insights — IS1 Team</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e2e8f0;
    --muted: #7c8298; --accent: #6366f1;
    --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { font-size: 16px; font-weight: 600; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .nav { display: flex; gap: 14px; align-items: center; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  .nav a:hover { color: var(--text); background: var(--border); }
  .nav a.active { color: var(--text); background: #6366f122; border: 1px solid #6366f155; }
  .stale { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #22c55e22; color: var(--green); border: 1px solid #22c55e33; }
  .stale.warn { background: #f59e0b22; color: var(--yellow); border-color: #f59e0b33; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .headline { background: linear-gradient(135deg, #6366f118, #1a1d27); border: 1px solid #6366f155; border-radius: 10px; padding: 20px; }
  .headline h2 { font-size: 18px; font-weight: 700; line-height: 1.45; }
  .take { color: var(--text); font-size: 13.5px; line-height: 1.65; margin-top: 10px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .col { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .col-name { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; color: var(--muted); }
  .col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .col li { padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: #0f1117; font-size: 12.5px; line-height: 1.5; }
  .tk { font-weight: 700; color: var(--accent); }
  .rm-tag { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; margin-left: 6px; }
  .sec-tag { font-weight: 700; color: var(--text); margin-right: 6px; }
  .risk li { border-left: 3px solid var(--red); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .foot { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 24px; }

</style>
</head>
<body>

<header>
  <div>
    <h1>AI Insights <span style="color:var(--muted);font-weight:400;font-size:13px">— model-written morning commentary on the coverage</span></h1>
    <div class="meta" id="meta">Loading...</div>
  </div>
  <nav class="nav">
    <a href="index.html">Index</a>
    <a href="coverage-morning-brief.html">Brief</a>
    <a href="disclosure-pulse.html">Disclosures</a>
    <a href="sector-heatmap.html">Heatmap</a>
    <a href="ticker-summary.html">Tickers</a>
    <a href="unusual-trading.html">Alerts</a>
    <a href="external-news.html">External</a>
    <a href="macro-overlays.html">Macro</a>
    <a href="ai-insights.html" class="active">AI</a>
    <span class="stale" id="staleBadge">..</span>
  </nav>
</header>

<div id="wrap" class="wrap"><div class="empty">Loading...</div></div>

<script>
function freshnessLabel(builtAt) {
  if (!builtAt) return { txt: '?', warn: true };
  const ageH = (Date.now() - new Date(builtAt).getTime()) / 36e5;
  return { txt: 'updated ' + (ageH < 1 ? Math.round(ageH * 60) + 'm' : Math.round(ageH) + 'h') + ' ago', warn: ageH > 36 };
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init() {
  try {
    const d = await fetch('./data/ai-insights.json').then(r => { if (!r.ok) throw new Error('no insights yet (HTTP ' + r.status + ')'); return r.json(); });
    const fresh = freshnessLabel(d._built_at);
    const badge = document.getElementById('staleBadge');
    badge.textContent = fresh.txt;
    if (fresh.warn) badge.classList.add('warn');
    document.getElementById('meta').textContent = `as of ${d.asOf || '?'} — generated by ${d.model || 'AI'}; commentary is model output, verify before acting`;

    document.getElementById('wrap').innerHTML = `
      <div class="headline">
        <h2>${esc(d.headline)}</h2>
        <div class="take">${esc(d.market_take)}</div>
      </div>
      <div class="grid">
        <div class="col">
          <div class="col-name">Watchlist</div>
          <ul>${(d.watchlist || []).map(w => `<li><span class="tk">${esc(w.tk)}</span><span class="rm-tag">${esc(w.rm)}</span><br>${esc(w.reason)}</li>`).join('') || '<li>Nothing flagged.</li>'}</ul>
        </div>
        <div class="col">
          <div class="col-name">Sector Notes</div>
          <ul>${(d.sector_notes || []).map(s => `<li><span class="sec-tag">${esc(s.sector)}</span>${esc(s.note)}</li>`).join('') || '<li>No sector notes.</li>'}</ul>
        </div>
        <div class="col risk">
          <div class="col-name">Risk Flags</div>
          <ul>${(d.risk_flags || []).map(r => `<li>${esc(r)}</li>`).join('') || '<li>No risk flags.</li>'}</ul>
        </div>
      </div>
      <div class="foot">Generated daily after the morning build from the same snapshots that power this dashboard (morning brief, unusual trading, disclosure pulse). Model output — not investment advice.</div>`;
  } catch(e) {
    document.getElementById('wrap').innerHTML = `<div class="empty">${esc(e.message)}<br><br>The AI commentary appears after the first daily build with GROQ_API_KEY configured.</div>`;
  }
}
init();
</script>
<script src="chat-dock.js" defer></script>
</body>
</html>
